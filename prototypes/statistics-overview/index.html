<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hagimi · 数据总览设计探索</title>
<style>
:root{--bg:#eeedf1;--surface:#ffffffbb;--text:#292a32;--muted:#737680;--line:#272e4212;--blue:#297be8;--green:#218776;--orange:#ba7029;--soft:#e7f0fa;--card:#ffffff8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;line-height:1.5}body.dark{--bg:#20222a;--surface:#30333ddd;--text:#eeeef4;--muted:#a8aab8;--line:#ffffff17;--soft:#2d4057;--card:#ffffff08}button,select{font:inherit;color:inherit;cursor:pointer}button{border:0;background:transparent;padding:8px 15px;border-radius:8px}button:focus-visible,select:focus-visible{outline:3px solid var(--blue)}.lab{max-width:1100px;margin:28px auto 18px;padding:0 24px}.labtop,.row,.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:650}h1{font-size:25px;margin:5px 0}h2{font-size:20px;margin:0}h3{font-size:15px;margin:0}p{margin:8px 0;color:var(--muted)}.switch,.range{display:flex;gap:3px;background:var(--line);padding:4px;border-radius:11px}.switch{margin:20px 0 10px;width:fit-content}.selected{background:var(--surface);box-shadow:0 1px 4px #0001;color:var(--blue)}.range button{padding:5px 13px;font-size:12px}.app{max-width:950px;margin:0 auto 22px;padding:30px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 65px #3532430d}.heading{margin-bottom:20px}.sub{font-size:12px;color:var(--muted)}.hero{padding:24px;background:linear-gradient(115deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:15px}.hero h2{font-size:26px;margin:7px 0}.tag{font-size:12px;color:var(--green);font-weight:600}.warn{color:var(--orange)}.badge{padding:5px 9px;border-radius:7px;background:var(--line);font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.card{padding:19px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.value{font-size:28px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:8px 0 2px}.value small{font-size:13px;letter-spacing:0;font-weight:450;color:var(--muted)}.mini{font-size:12px;color:var(--muted)}.section{margin-top:22px}.detailrow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.detailrow:last-child{border:0}.bar{height:6px;border-radius:5px;background:var(--line);margin:12px 0}.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}.foot{border-top:1px solid var(--line);padding-top:15px;margin-top:20px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.link{color:var(--blue);padding:0}.score{font-size:54px;font-weight:650;line-height:1.1;letter-spacing:-2px}.score small{font-size:14px;font-weight:400;letter-spacing:0}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.chart{height:145px;display:flex;align-items:end;gap:5px;padding:15px 0 0}.chart span{flex:1;background:var(--blue);opacity:.65;border-radius:3px 3px 0 0;min-height:4px}.chart span.hot{background:var(--orange);opacity:1}.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px}.event{border-left:2px solid var(--orange);padding:0 0 0 13px;margin-top:20px}.matrix{width:100%;border-collapse:collapse;margin:17px 0}.matrix td,.matrix th{text-align:left;padding:16px 10px;border-bottom:1px solid var(--line)}.matrix th{font-size:11px;color:var(--muted);font-weight:500}.matrix td{font-size:13px}.matrix td:nth-child(2){font-weight:600}.note{max-width:950px;margin:0 auto 35px;color:var(--muted);font-size:12px;padding:0 8px}dialog{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:18px;padding:28px;max-width:580px}dialog::backdrop{background:#14152255}dialog p{line-height:1.9}select{border:1px solid var(--line);background:var(--surface);padding:6px;border-radius:7px}@media(max-width:700px){.app{margin:12px;padding:18px}.lab{padding:0 18px}.grid,.two{grid-template-columns:1fr}.heading,.labtop{align-items:flex-start;flex-wrap:wrap}.detailrow{grid-template-columns:1fr 1fr}.detailrow>:last-child{grid-column:1/-1}.matrix td,.matrix th{padding:12px 5px}.switch button{padding:7px 9px}.note{padding:12px}.hero h2{font-size:22px}}
</style>
<div class="lab"><div class="labtop"><div><div class="eyebrow">HAGIMI MONITOR / DESIGN STUDY 01</div><h1>让统计回答实际问题</h1></div><div class="row"><select id="scenario" aria-label="数据场景"><option value="normal">示例：有热压力</option><option value="missing">示例：数据不足</option></select><button id="theme">切换深色</button></div></div><nav class="switch" aria-label="原型版本"><button data-v="a">A · 状态摘要</button><button data-v="b">B · 时段分析</button><button data-v="c">C · 指标总览</button></nav><div class="sub">交互原型 · 所有数值均为演示数据，非本机测量 · 支持范围、外观与缺失状态切换</div></div>
<main class="app"><div class="heading"><h2>数据总览</h2><div class="range"><button data-r="0">今日</button><button data-r="1">近 7 日</button><button data-r="2">近 30 日</button></div></div><div id="content"></div><div class="foot"><span id="coverage"></span><button class="link" id="method">指标与数据口径 ↗</button></div></main><p class="note" id="note"></p>
<dialog id="modal"><h2>这份总览如何解读</h2><p>CPU、GPU 满载描述工作强度，不直接代表异常。内存压力和系统热状态用于判断是否需要关注，也不能单独证明用户发生了卡顿。</p><p>本原型中的真实状态时长、事件合并、负载分布与新版评分，需要新增帧级状态秒数、有效观测秒数和事件摘要。不能从现有应力均值反推这些数值。</p><p>采样覆盖仅表示应用记录到的时间，不等同于人的使用时长。缺失时段不补零；维度缺失时不展示完整评分。</p><button id="close" class="selected">知道了</button></dialog>
<script>
let version=new URLSearchParams(location.search).get('v')||'a',range=0;const datasets=[{time:'8 小时 20 分',heat:18,mem:7,cpu:'1 小时 12 分',gpu:'2 小时 46 分',down:'987 MB',up:'3.19 GB',read:'83.95 GB',write:'79.18 GB',power:'19.2',swap:'1.4',comp:'2.8',score:98},{time:'42 小时 10 分',heat:94,mem:36,cpu:'6 小时 08 分',gpu:'13 小时 42 分',down:'8.4 GB',up:'12.6 GB',read:'411 GB',write:'324 GB',power:'18.7',swap:'1.2',comp:'2.5',score:98},{time:'168 小时 40 分',heat:310,mem:121,cpu:'21 小时 20 分',gpu:'48 小时 12 分',down:'34.8 GB',up:'45.2 GB',read:'1.62 TB',write:'1.28 TB',power:'18.1',swap:'1.1',comp:'2.4',score:99}];
const cards=(d)=>`<div class="grid"><div class="card"><div class="tag warn">热状态 · 需关注</div><div class="value">${d.heat} <small>分钟</small></div><div class="mini">系统 serious / critical 累计</div></div><div class="card"><div class="tag">内存压力</div><div class="value">${d.mem} <small>分钟</small></div><div class="mini">系统警告 / 严重状态累计</div></div><div class="card"><div class="tag">工作强度</div><div class="value">${d.gpu}</div><div class="mini">GPU ≥ 90% · 高负载不扣分</div></div></div>`;
function chart(){return `<div class="chart" role="img" aria-label="演示负载分布，橙色标示系统热压力时段">${Array.from({length:48},(_,i)=>`<span class="${i>28&&i<33?'hot':''}" style="height:${18+Math.abs(Math.sin(i*.7))*36+(i>23&&i<37?40:0)}%"></span>`).join('')}</div><div class="ticks"><span>${range?'范围起点':'09:00'}</span><span>${range?'范围中点':'13:00'}</span><span>${range?'范围终点':'18:00'}</span></div>`}
function render(){const d=datasets[range],missing=document.querySelector('#scenario').value==='missing';document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('selected',b.dataset.v===version));document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('selected',+b.dataset.r===range));document.querySelector('#coverage').textContent=missing?'仅记录 3 分钟 · 热状态不可用':'采样覆盖 '+d.time+' · 不包含未记录时段';let s='';if(missing){s=`<div class="hero"><span class="badge">等待更多数据</span><h2>暂时无法判断整体状态</h2><p>当前仅有 3 分钟 CPU 记录，内存与热状态数据不足。</p><p>记录期间 CPU 均值 23.6%。单一维度不生成健康评分。</p></div><div class="grid">${['热状态','内存压力','历史对比'].map(x=>`<div class="card"><h3>${x}</h3><div class="value">—</div><span class="mini">暂无足够观测</span></div>`).join('')}</div>`}else if(version==='a'){s=`<div class="hero"><div class="row"><span class="tag warn">● 有少量热压力时段</span><span class="badge">状态摘要</span></div><h2>值得留意热压力出现的时段</h2><p>记录期间，系统热状态达到 serious / critical 共 ${d.heat} 分钟。<br>GPU 高负载共 ${d.gpu}，单凭满载无需处理。</p><button class="link" onclick="choose('b')">查看时段分布 →</button></div>${cards(d)}<div class="section"><div class="row"><h3>资源使用概况</h3><span class="sub">用量与压力分开看</span></div><div class="detailrow"><b>计算负载</b><span>CPU 高负载 ${d.cpu}</span><span class="mini">CPU ≥ 85% · 按有效观测累计</span></div><div class="detailrow"><b>内存支撑</b><span>平均压缩 ${d.comp} GB</span><span class="mini">平均交换占用 ${d.swap} GB</span></div><div class="detailrow"><b>数据传输</b><span>↓ ${d.down}　↑ ${d.up}</span><span class="mini">磁盘写入 ${d.write}</span></div></div>`}else if(version==='b'){s=`<div class="row"><div><h2>压力集中在什么时候？</h2><p>结合负载与系统状态，定位值得回看的时段。</p></div><span class="badge">橙色：系统热压力</span></div><div class="two"><div class="card"><div class="row"><h3>${range?'范围内负载趋势':'今日负载时间线'}</h3><span class="mini">GPU 使用率</span></div>${chart()}<p class="mini">空档应留白；曲线不跨缺失时段连接。</p></div><div class="card"><h3>范围摘要</h3><div class="event"><b class="warn">热压力 ${d.heat} 分钟</b><p class="mini">与高负载同时出现不等于因果关系。</p></div><div class="event" style="border-color:var(--green)"><b>内存压力 ${d.mem} 分钟</b><p class="mini">累计警告 / 严重状态。</p></div></div></div><div class="section"><h3>${range?'代表性时段 · 示例':'关注时段 · 示例'}</h3><div class="detailrow"><b>14:12 — 14:30</b><span class="warn">系统热压力 · 18 分钟</span><span class="mini">该时段 GPU 均值 96%</span></div><div class="detailrow"><b>11:06 — 11:13</b><span>内存警告 · 7 分钟</span><span class="mini">该时段平均交换占用 2.1 GB</span></div></div><div class="card section"><h3>如何解读</h3><p>优先查看热压力与内存压力持续较长的时段，再结合当时正在执行的任务判断。当前记录无法确定哪个应用造成了压力。</p></div>`}else{s=`<div class="hero row"><div><span class="tag">状态评分 · 候选口径</span><h2>整体压力较低</h2><p>同时记录到 ${d.heat} 分钟热压力，建议回看。</p><button class="link" onclick="document.querySelector('#modal').showModal()">评分只衡量内存与热压力 ↗</button></div><div class="score">${d.score}<small> / 100</small></div></div><table class="matrix"><thead><tr><th>维度</th><th>主要指标</th><th>补充信息</th><th>解读</th></tr></thead><tbody><tr><td>热状态</td><td>${d.heat} 分钟压力</td><td>serious / critical</td><td class="warn">回看时段</td></tr><tr><td>内存</td><td>${d.mem} 分钟压力</td><td>平均交换 ${d.swap} GB</td><td>关注持续压力</td></tr><tr><td>CPU</td><td>${d.cpu} 高负载</td><td>≥ 85%</td><td>工作强度</td></tr><tr><td>GPU</td><td>${d.gpu} 高负载</td><td>≥ 90%</td><td>工作强度</td></tr><tr><td>网络</td><td>↓ ${d.down}</td><td>↑ ${d.up}</td><td>传输用量</td></tr><tr><td>磁盘</td><td>写入 ${d.write}</td><td>读取 ${d.read}</td><td>读写用量</td></tr><tr><td>功率</td><td>平均 ${d.power} W</td><td>依现有传感器口径</td><td>不作能效排名</td></tr></tbody></table>`}document.querySelector('#content').innerHTML=s;document.querySelector('#note').textContent={a:'A / 推荐方向：一条结论 + 三个有意义的指标 + 紧凑用量摘要。移除大分数环，把“是否值得关注”放在第一位。',b:'B / 分析方向：用时间线与事件承载信息，适合详细统计页。事件、时长与图表均为设计样例，落地需要新增状态事件汇总。',c:'C / 保守方向：保留评分习惯，压缩为表格。分数为候选模型的演示值；异常提示独立展示，不再暗改评级。'}[version]}
function choose(v){version=v;history.replaceState(null,'','?v='+v);render()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>choose(b.dataset.v));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{range=+b.dataset.r;render()});document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark');document.querySelector('#theme').textContent=document.body.classList.contains('dark')?'切换浅色':'切换深色'};document.querySelector('#scenario').onchange=render;document.querySelector('#method').onclick=()=>document.querySelector('#modal').showModal();document.querySelector('#close').onclick=()=>document.querySelector('#modal').close();if(!['a','b','c'].includes(version))version='a';render();
</script></html>
