<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<title>HagimiMonitor · 并排 + 纯图标扇面（压缩节点间距）</title>
<style>
  :root {
    --panel-bg: rgba(0, 0, 0, 0.35);
    --row-glass: rgba(122, 145, 180, 0.12);
    --row-separator: rgba(122, 145, 180, 0.22);
    --text-primary: rgba(255, 255, 255, 0.96);
    --text-secondary: rgba(255, 255, 255, 0.82);
    --text-caption: rgba(255, 255, 255, 0.68);
    --track-fill: rgba(255, 255, 255, 0.08);
    --tint-cpu: #D27A4A; --tint-gpu: #5D8CF0; --tint-net: #43A6A0;
    --tint-mem: #42A39A; --tint-sto: #9A865E; --tint-bat: #65AF52;
    --sev-warn: #B8872E; --row-radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    min-height: 100vh; color: var(--text-primary);
    background: radial-gradient(1400px 800px at 30% 0%, #2b3a5c 0%, transparent 55%),
                radial-gradient(1200px 700px at 85% 100%, #3d2b4f 0%, transparent 55%), #191c24;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 30px 16px 60px; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .ctl .grp { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); padding: 5px 8px; border-radius: 9px; }
  .ctl .grp > span { font-size: 11px; color: var(--text-caption); }
  .ctl button { font: inherit; font-size: 12px; color: var(--text-secondary); background: transparent;
                border: 1px solid rgba(255,255,255,0.14); border-radius: 7px; padding: 3px 10px; cursor: pointer; }
  .ctl button.active { background: rgba(101,175,82,0.22); border-color: rgba(101,175,82,0.55); color: #fff; }

  .panel { width: 340px; background: var(--panel-bg); border-radius: 18px; padding: 10px;
           backdrop-filter: blur(28px) saturate(1.2); -webkit-backdrop-filter: blur(28px) saturate(1.2);
           box-shadow: 0 22px 60px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 8px; }
  .row-glass { background: var(--row-glass); border-radius: var(--row-radius); padding: 8px 10px; }
  .row-head { display: flex; align-items: center; gap: 6px; height: 26px; }
  .row-head .label { font-size: 13px; color: var(--text-secondary); }
  .row-head .value { font-size: 14px; font-weight: 600; }
  .row-head .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--text-secondary);
          background: rgba(255,255,255,0.08); border-radius: 999px; padding: 2px 7px; }
  .sep { height: 1px; background: var(--row-separator); opacity: 0.7; margin: 7px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }
  .gcell { display: flex; align-items: center; justify-content: space-between; gap: 6px;
           background: var(--track-fill); border-radius: 7px; padding: 4px 8px; height: 24px; }
  .gcell .gl { font-size: 12px; color: var(--text-caption); }
  .gcell .gv { font-size: 12px; font-weight: 600; }
  .sec-title { display: flex; align-items: center; gap: 8px; margin: 5px 0 4px; }
  .sec-title .t { font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-caption); white-space: nowrap; }
  .sec-title .line { flex: 1; height: 1px; background: var(--row-separator); opacity: 0.7; }
  .sec-title .hint { font-size: 10px; color: var(--text-caption); white-space: nowrap; }

  .flow { position: relative; }
  .flow svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .fnode { border-radius: 9px; background: var(--track-fill); display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 1px; }
  .fnode.adapt { width: 90px; height: 46px; flex-shrink: 0; }
  .fnode.sys { width: 90px; height: 46px; flex-shrink: 0; }
  .fnode .fl { font-size: 10.5px; color: var(--text-caption); }
  .fnode .fv { font-size: 12.5px; font-weight: 600; }
  .fnode .fv .u { font-size: 9.5px; color: var(--text-caption); margin-left: 2px; }
  .fbar { position: relative; height: 38px; border-radius: 8px; background: var(--track-fill); overflow: hidden; }
  .fbar .fill { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 6px;
                background: linear-gradient(90deg, rgba(101,175,82,0.55), rgba(101,175,82,0.9)); }
  .fbar .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
                 padding: 0 10px; font-size: 11.5px; }
  .flow-note { margin-top: 4px; font-size: 10px; color: var(--text-caption); }
  .fan-hint { margin-top: 3px; font-size: 9.5px; color: var(--text-caption); text-align: right; }

  .fanarea { flex: 1; min-width: 0; display: flex; align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
          border-radius: 8px; background: var(--track-fill); }
  .cell .ico { display: flex; align-items: center; justify-content: center; border-radius: 5px;
               background: rgba(255,255,255,0.10); }
  .cell .pct { font-size: 9.5px; font-weight: 500; color: var(--text-secondary); }
  .cell.agg .ico { background: var(--track-fill); color: var(--text-caption); }
  .cell.agg .pct { color: var(--text-caption); }

  .budget { max-width: 920px; font-size: 12px; line-height: 1.8; color: var(--text-caption); }
  .budget b { color: var(--text-secondary); font-weight: 600; }
  .budget code { font-family: "SF Mono", ui-monospace, monospace; font-size: 11.5px; }
  .budget .ok { color: #7DC48B; }
  .budget .bad { color: var(--sev-warn); }
  .gapshim { height: 46px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="ctl">
  <div class="grp"><span>扇面排布</span>
    <button data-v="col" class="active">A 右侧竖列 1×6</button>
    <button data-v="g23">B 网格 2×3</button>
    <button data-v="g32">C 网格 3×2（等高）</button>
  </div>
  <div class="grp"><span>节点间距</span>
    <button data-g="wide">原始（留足流光）</button>
    <button data-g="tight" class="active">压缩</button>
  </div>
  <div class="grp"><span>面板宽</span>
    <button data-w="300">300</button>
    <button data-w="340" class="active">340</button>
    <button data-w="460">460</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="row-head">
    <span class="label">电源:</span><span class="value mono">85%</span>
    <span class="spacer"></span>
    <span class="pill mono">⚡︎ 30.4W</span>
    <span class="pill mono">◔ 19.7W</span>
  </div>

  <div class="row-glass">
    <div class="sep" style="margin-top:0"></div>
    <div class="grid2">
      <div class="gcell"><span class="gl">健康度</span><span class="gv mono">92%</span></div>
      <div class="gcell"><span class="gl">循环次数</span><span class="gv mono">118</span></div>
      <div class="gcell"><span class="gl">温度</span><span class="gv mono">31°C</span></div>
      <div class="gcell"><span class="gl">转换损耗</span><span class="gv mono">3.2 W</span></div>
    </div>

    <div class="sec-title">
      <span class="t">功率流</span><span class="line"></span>
      <span class="hint">进程为实测 · 未含系统进程</span>
    </div>

    <div class="flow" id="flow">
      <svg class="edges" id="edges"></svg>

      <div style="display:flex; align-items:center; gap:0;">
        <div class="fnode adapt" id="node-adapt">
          <div class="fl">适配器 · 65W</div>
          <div class="fv mono">19.7<span class="u">W</span></div>
        </div>
        <div class="gapshim" id="gap"></div>
        <div class="fnode sys" id="node-sys">
          <div class="fl">系统负载</div>
          <div class="fv mono">19.7<span class="u">W</span></div>
        </div>
        <div class="gapshim" style="width:6px; flex:0 0 6px;"></div>
        <div class="fanarea" id="fan-host"></div>
      </div>

      <div class="fbar" id="fbar" style="margin-top:8px;">
        <div class="fill" id="bar-fill"></div>
        <div class="label"><span>85% 交流电源</span><span class="mono">已达上限</span></div>
      </div>
    </div>
    <div class="flow-note">约 52 分钟充满</div>
    <div class="fan-hint">图标悬浮查看应用名与瓦数 · 未含系统进程</div>
  </div>
</div>

<div class="budget" id="budget"></div>

<script>
const APPS = [
  { name: 'Qoder CN',       emoji: '🧠', w: 1.30, color: 'var(--tint-gpu)' },
  { name: 'HapiGo',         emoji: '🔍', w: 0.72, color: 'var(--tint-cpu)' },
  { name: 'WindowManager',  emoji: '🪟', w: 0.34, color: 'var(--tint-net)' },
  { name: 'Microsoft Edge', emoji: '🌐', w: 0.22, color: 'var(--tint-mem)' },
  { name: '微信',           emoji: '💬', w: 0.17, color: 'var(--tint-sto)' },
];
const OTHER_W = 0.18;
const ICON = 16;          // 纯图标形态下的小图标（识别度与宽度的折中）
const CELL_W = ICON + 12; // 格宽（含内衬）
const CELL_H = ICON + 10;

let variant = 'col', gapMode = 'tight', width = 340;

function compute() {
  const rows = APPS.map(a => ({ ...a })).sort((a, b) => b.w - a.w);
  const total = rows.reduce((s, r) => s + r.w, 0) + OTHER_W;
  const top = rows.slice(0, 5).map(r => ({ ...r, share: r.w / total }));
  const other = Math.max(0, 1 - top.reduce((s, r) => s + r.share, 0));
  const pcts = top.map(r => Math.max(1, Math.round(r.share * 100)));
  return { top, other, otherPct: Math.max(0, 100 - pcts.reduce((s, v) => s + v, 0)), pcts };
}

function cellHTML(it, w, h) {
  return `<div class="cell${it.agg ? ' agg' : ''}" title="${it.name} · ${it.watts.toFixed(2)} W · ${it.pct}%"
            style="width:${w}px;height:${h}px">
      <span class="ico" style="width:${ICON}px;height:${ICON}px;font-size:${Math.round(ICON * 0.6)}px">${it.emoji}</span>
      <span class="pct mono">${it.pct}%</span></div>`;
}

function items(d) {
  return [...d.top.map((r, i) => ({ name: r.name, emoji: r.emoji, pct: d.pcts[i], agg: false, color: r.color, watts: r.w })),
          { name: '其他（聚合）', emoji: '⋯', pct: d.otherPct, agg: true, color: 'rgba(255,255,255,0.34)', watts: OTHER_W }];
}

function renderFan(d) {
  const host = document.getElementById('fan-host');
  const list = items(d);
  if (variant === 'col') {
    host.innerHTML = `<div style="display:grid; gap:3px; grid-template-columns:${CELL_W}px; justify-content:end; width:100%;">`
      + list.map(it => cellHTML(it, CELL_W, CELL_H)).join('') + `</div>`;
  } else if (variant === 'g23') {
    host.innerHTML = `<div style="display:grid; gap:4px; grid-template-columns:repeat(2, ${CELL_W}px); justify-content:end; width:100%;">`
      + list.map(it => cellHTML(it, CELL_W, CELL_H)).join('') + `</div>`;
  } else {
    host.innerHTML = `<div style="display:grid; gap:4px; grid-template-columns:repeat(3, ${CELL_W}px); justify-content:end; width:100%;">`
      + list.map(it => cellHTML(it, CELL_W, CELL_H)).join('') + `</div>`;
  }
}

function drawCurves(d) {
  const flow = document.getElementById('flow');
  const svg = document.getElementById('edges');
  const box = flow.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${flow.clientWidth} ${flow.clientHeight}`);
  const rel = el => {
    const r = el.getBoundingClientRect();
    return { left: r.left - box.left, right: r.right - box.left, top: r.top - box.top,
             bottom: r.bottom - box.top, cx: r.left - box.left + r.width / 2,
             cy: r.top - box.top + r.height / 2 };
  };
  const adapt = rel(document.getElementById('node-adapt'));
  const sys = rel(document.getElementById('node-sys'));
  const bar = rel(document.getElementById('fbar'));
  const junctionX = bar.left + bar.w / 2;
  let s = '';
  // 原设计横管（适配器 → 系统，途经汇流点）+ 汇流点 → 电池条竖管，全部保留
  s += `<path d="M${adapt.right} ${adapt.cy} H${sys.left}" stroke="rgba(93,140,240,0.85)" stroke-width="2" fill="none"/>`;
  s += `<circle cx="${junctionX}" cy="${adapt.cy}" r="4.5" fill="#4F8FF7"/>`;
  s += `<path d="M${junctionX} ${adapt.bottom} V${bar.top}" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" fill="none"/>`;

  const specs = [...d.top.map(r => ({ share: r.share, color: r.color })), { share: d.other, color: 'rgba(255,255,255,0.34)' }];
  const max = Math.max(...specs.map(x => x.share), 0.0001);
  const cells = [...document.querySelectorAll('#fan-host .cell')];
  cells.forEach((el, i) => {
    if (!specs[i]) return;
    const t = rel(el);
    const startX = sys.right, startY = sys.cy;
    const endX = t.left - 4, endY = t.cy;
    const w = (1 + (specs[i].share / max) * 2.2).toFixed(2);
    s += `<path d="M${startX} ${startY} C${startX + (endX - startX) * 0.5} ${startY}, ${startX + (endX - startX) * 0.5} ${endY}, ${endX} ${endY}"
            stroke="${specs[i].color}" stroke-width="${w}" fill="none" opacity="0.9"/>`;
  });
  svg.innerHTML = s;
}

function renderAll() {
  document.getElementById('panel').style.width = width + 'px';
  document.getElementById('bar-fill').style.width = 'calc(85% - 4px)';
  document.getElementById('gap').style.width = (gapMode === 'tight' ? 28 : 120) + 'px';
  document.getElementById('gap').style.flex = `0 0 ${gapMode === 'tight' ? 28 : 120}px`;

  const d = compute();
  renderFan(d);
  requestAnimationFrame(() => drawCurves(d));

  const content = width - 20 - 20;
  const gap = gapMode === 'tight' ? 28 : 120;
  const fanWidth = content - 90 - gap - 90 - 6;
  const cols = variant === 'col' ? 1 : variant === 'g23' ? 2 : 3;
  const rows = variant === 'col' ? 6 : variant === 'g23' ? 3 : 2;
  const needed = cols * CELL_W + (cols - 1) * 4;
  const fanHeight = rows * CELL_H + (rows - 1) * (variant === 'col' ? 3 : 4);
  const flowHeight = Math.max(46, fanHeight) + 8 + 38;
  const ok = fanWidth >= needed;

  document.getElementById('budget').innerHTML = `
    <p><b>排布</b>：${({col:'A 右侧竖列 1×6',g23:'B 网格 2×3',g32:'C 网格 3×2'})[variant]}
      · 节点间距 ${gapMode === 'tight' ? '压缩 28pt' : '原始 120pt'} · 面板 ${width}pt（内容 ${content}pt）</p>
    <p><b>横向预算</b>：内容 ${content} − 适配器 90 − 间距 ${gap} − 系统 90 − 留白 6 =
      <code>${fanWidth}pt</code>，本排布需要 <code>${needed}pt</code>
      → ${ok ? '<span class="ok">放得下</span>' : '<span class="bad">放不下</span>'}</p>
    <p><b>纵向代价</b>：扇面 ${fanHeight}pt（${rows} 行 × ${CELL_H}pt + 间距）→ 流向区总高 <code>${flowHeight}pt</code>，
      对比原设计 <code>100pt</code>（<b>+${flowHeight - 100}pt</b>）；经典并排两节点的连线（横管 + 汇流点 + 竖管）全部保留。</p>
    <p><b>压缩间距的代价</b>：横管从 ${gapMode === 'tight' ? '120 → 28' : '120'}pt，流光在短管上可读性下降；若不压缩，右侧只剩 ${content - 90 - 120 - 90 - 6}pt，仅能放 2 列网格。</p>
  `;
}

document.querySelectorAll('.ctl button').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.v) variant = btn.dataset.v;
    if (btn.dataset.g) gapMode = btn.dataset.g;
    if (btn.dataset.w) width = Number(btn.dataset.w);
    renderAll();
  });
});
window.addEventListener('resize', renderAll);
renderAll();
</script>
</body>
</html>
