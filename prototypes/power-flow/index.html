<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HagimiMonitor · 电源行展开：功率流原型 v2</title>
<style>
  /* ====== 设计令牌：对齐 MonitorPalette (balanced · dark) ====== */
  :root {
    --panel-bg: rgba(0, 0, 0, 0.35);
    --row-glass: rgba(122, 145, 180, 0.12);   /* neutralGlassTint dark */
    --row-separator: rgba(122, 145, 180, 0.22);
    --text-primary: rgba(255, 255, 255, 0.96);
    --text-value: rgba(255, 255, 255, 0.90);
    --text-secondary: rgba(255, 255, 255, 0.82);
    --text-caption: rgba(255, 255, 255, 0.68);
    --track-fill: rgba(255, 255, 255, 0.08);
    --tint-cpu: #D27A4A;
    --tint-gpu: #5D8CF0;
    --tint-mem: #42A39A;
    --tint-sto: #9A865E;
    --tint-net: #43A6A0;
    --tint-bat: #65AF52;
    --sev-warn: #B8872E;
    --sev-crit: #D94848;
    --row-radius: 14px;   /* MonitorConstants.rowCornerRadius */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(1400px 800px at 30% 0%, #2b3a5c 0%, transparent 55%),
      radial-gradient(1200px 700px at 85% 100%, #3d2b4f 0%, transparent 55%),
      #191c24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 36px 16px;
    -webkit-font-smoothing: antialiased;
    color: var(--text-primary);
  }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* ====== 面板：340pt 宽 · padding 10 ====== */
  .panel {
    width: 340px;
    background: var(--panel-bg);
    backdrop-filter: blur(40px) saturate(1.3);
    border-radius: 20px;
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 面板头：SYSTEM · LIVE + 时间 */
  .panel-header {
    display: flex;
    align-items: center;
    padding: 2px 2px 0;
  }
  .live-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #6BBF59;
    margin-right: 5px;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .panel-header .sys { font-size: 9px; letter-spacing: 1.1px; color: var(--text-caption); font-weight: 500; }
  .panel-header .time { margin-left: auto; font-size: 10px; color: var(--text-caption); }

  /* ====== 玻璃行 ====== */
  .row {
    background: var(--row-glass);
    border-radius: var(--row-radius);
    border: 0.5px solid rgba(255, 255, 255, 0.06);
  }
  .row-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    cursor: default;
  }
  .row-head .icon {
    width: 18px;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }
  .row-head .icon svg { display: block; }
  .row-head .label { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
  .row-head .value { font-size: 12px; font-weight: 600; color: var(--text-value); white-space: nowrap; }
  .row-head .spacer { flex: 1; min-width: 4px; }

  /* sparkline / progress 占位 */
  .spark { width: 56px; height: 18px; flex-shrink: 0; }
  .meter { width: 56px; height: 3px; border-radius: 2px; background: var(--track-fill); overflow: hidden; flex-shrink: 0; }
  .meter > div { height: 100%; border-radius: 2px; }

  /* 电源行双 pill：定宽 74，右对齐 */
  .pill {
    width: 74px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .pill .psym { opacity: 0.72; font-size: 9px; }
  .pill.charging .psym { color: var(--tint-bat); opacity: 1; }

  /* ====== 展开区（CollapsibleDetail） ====== */
  .detail { padding: 0 10px 9px; }
  .detail .sep {
    height: 1px;
    background: var(--row-separator);
    margin-left: 28px;
    margin-bottom: 8px;
  }

  /* 分区标题：线 + 标签，隔离指标网格与图表（对齐面板分隔规范） */
  .sec-title {
    margin-left: 28px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    color: var(--text-caption);
    letter-spacing: 0.3px;
    margin-bottom: 8px;
  }
  .sec-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--row-separator), transparent);
  }
  .sec-title .hint { margin-left: auto; opacity: 0.7; letter-spacing: 0; }

  /* ---- 既有区块：两列指标网格 ---- */
  .grid {
    margin-left: 28px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 16px;
    row-gap: 7px;
  }
  .gcell { display: flex; align-items: baseline; font-size: 11px; }
  .gcell .gl { color: var(--text-caption); }
  .gcell .gv { margin-left: auto; color: var(--text-secondary); font-weight: 500; }

  /* ---- 区块 A：功率流 v2（玻璃节点 + 辉光导管） ---- */
  .flow {
    margin-left: 28px;
    margin-bottom: 12px;
  }
  .flow-diagram { position: relative; width: 272px; height: 108px; }
  .flow-diagram svg.edges { position: absolute; inset: 0; overflow: visible; }

  .fnode {
    position: absolute;
    width: 88px;
    border-radius: 11px;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.085), rgba(255, 255, 255, 0.028));
    border: 0.5px solid rgba(255, 255, 255, 0.11);
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.10),
      0 6px 16px rgba(0, 0, 0, 0.28);
    padding: 6px 9px 7px;
    transition: opacity 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .fnode .fh {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 2px;
  }
  .fnode .fh svg { flex-shrink: 0; display: block; opacity: 0.85; }
  .fnode .fl {
    font-size: 8.5px;
    color: var(--text-caption);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.2px;
  }
  .fnode .fv { font-size: 14.5px; font-weight: 650; color: var(--text-value); white-space: nowrap; letter-spacing: -0.2px; }
  .fnode .fv .u { font-size: 9px; font-weight: 500; color: var(--text-caption); margin-left: 1.5px; }

  /* 适配器占用微条：输入 / 铭牌上限 */
  .fnode .fbar {
    margin-top: 4px;
    height: 2.5px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  .fnode .fbar > div {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.35), rgba(255,255,255,0.60));
    transition: width 0.6s cubic-bezier(0.3, 0.9, 0.4, 1), background 0.3s ease;
  }
  .fnode.alert .fbar > div { background: linear-gradient(90deg, var(--sev-warn), var(--sev-crit)); }

  .fnode.dimmed { opacity: 0.35; }
  .fnode.glow-charge {
    border-color: rgba(101, 175, 82, 0.40);
    animation: breath 3s ease-in-out infinite;
  }
  @keyframes breath {
    0%,100% { box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.10), 0 0 6px rgba(101, 175, 82, 0.10); }
    50%     { box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.10), 0 0 16px rgba(101, 175, 82, 0.32); }
  }
  .fnode.glow-drain { border-color: rgba(101, 175, 82, 0.28); }
  .fnode.alert {
    border-color: rgba(217, 72, 72, 0.55);
    animation: breath-crit 2.2s ease-in-out infinite;
  }
  .fnode.alert .fv { color: var(--sev-crit); }
  @keyframes breath-crit {
    0%,100% { box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.08), 0 0 5px rgba(217, 72, 72, 0.10); }
    50%     { box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.08), 0 0 14px rgba(217, 72, 72, 0.30); }
  }

  #fn-adapter { left: 0;     top: 6px; }
  #fn-system  { left: 184px; top: 6px; }
  #fn-battery { left: 92px;  top: 64px; }

  .flow-note {
    width: 272px;
    font-size: 10px;
    color: var(--text-caption);
    margin-top: 7px;
    line-height: 1.5;
  }
  .flow-note.crit { color: var(--sev-crit); }

  /* ---- 区块 B：耗电排行 ---- */
  .procs { margin-left: 28px; display: flex; flex-direction: column; gap: 5px; }
  .prow {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 17px;
  }
  .prow .picon {
    width: 15px; height: 15px;
    border-radius: 4px;
    font-size: 9.5px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.08);
    flex-shrink: 0;
  }
  .prow .pname {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex-shrink: 1;
  }
  .prow .ptrack {
    flex: 1;
    height: 3.5px;
    border-radius: 2px;
    background: var(--track-fill);
    overflow: hidden;
    min-width: 30px;
  }
  .prow .pbar {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--tint-bat) 68%, transparent),
      var(--tint-bat));
    box-shadow: 0 0 4px color-mix(in srgb, var(--tint-bat) 35%, transparent);
    transition: width 0.55s cubic-bezier(0.3, 0.9, 0.4, 1);
  }
  .prow.hot .pbar {
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--sev-crit) 68%, transparent),
      var(--sev-crit));
    box-shadow: 0 0 5px color-mix(in srgb, var(--sev-crit) 40%, transparent);
  }
  .prow .pw {
    width: 46px;
    text-align: right;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .prow.placeholder .pname, .prow.placeholder .pw { color: rgba(255,255,255,0.28); }

  /* 子系统实测行（IOReport）：无 App 图标、条形改中性色，与估算的进程行区分 */
  .sub-sep {
    height: 1px;
    background: var(--row-separator);
    opacity: 0.6;
    margin: 3px 0;
  }
  .prow.sub .picon {
    background: transparent;
    color: var(--text-caption);
    font-size: 10px;
  }
  .prow.sub .pname { color: var(--text-caption); }
  .prow.sub .pbar {
    background: linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0.34));
    box-shadow: none;
  }
  .prow.sub .pw { color: var(--text-caption); }

  /* ====== 原型控制（面板外部，非产品 UI） ====== */
  .proto-ctl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .proto-tabs {
    display: flex;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 9px;
    padding: 2px;
  }
  .proto-tabs button {
    border: none; background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font-size: 11.5px; font-family: inherit;
    padding: 5px 14px; border-radius: 7px; cursor: pointer;
    transition: all 0.15s ease;
  }
  .proto-tabs button.active {
    background: rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.92);
    font-weight: 600;
  }
  .proto-cap { font-size: 10.5px; color: rgba(255, 255, 255, 0.35); }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-header">
    <div class="live-dot"></div>
    <div class="sys">SYSTEM · LIVE</div>
    <div class="time mono" id="clock">14:32</div>
  </div>

  <!-- CPU -->
  <div class="row"><div class="row-head">
    <span class="icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--tint-cpu)" stroke-width="1.3"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="5.4" y="5.4" width="3.2" height="3.2" rx="0.6" fill="var(--tint-cpu)" stroke="none"/><path d="M5 3V1M9 3V1M5 13v-2M9 13v-2M3 5H1M3 9H1M13 5h-2M13 9h-2"/></svg></span>
    <span class="label">CPU:</span><span class="value mono">12%</span>
    <span class="spacer"></span>
    <svg class="spark" viewBox="0 0 56 18"><polyline points="0,13 6,12 12,14 18,9 24,11 30,6 36,10 42,8 48,12 56,10" fill="none" stroke="var(--tint-cpu)" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div></div>

  <!-- GPU -->
  <div class="row"><div class="row-head">
    <span class="icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--tint-gpu)" stroke-width="1.3"><rect x="1.5" y="3.5" width="11" height="7" rx="1.5"/><circle cx="5.4" cy="7" r="1.8"/><path d="M9.4 5.4v3.2M11 5.4v3.2"/></svg></span>
    <span class="label">GPU:</span><span class="value mono">7%</span>
    <span class="spacer"></span>
    <svg class="spark" viewBox="0 0 56 18"><polyline points="0,14 8,13 16,14 22,12 28,13 34,11 40,13 46,12 56,13" fill="none" stroke="var(--tint-gpu)" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div></div>

  <!-- 内存 -->
  <div class="row"><div class="row-head">
    <span class="icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--tint-mem)" stroke-width="1.3"><rect x="1.5" y="4" width="11" height="6" rx="1"/><path d="M4 10v2M7 10v2M10 10v2M4 4V2.5M7 4V2.5M10 4V2.5"/></svg></span>
    <span class="label">内存:</span><span class="value mono">61%</span>
    <span class="spacer"></span>
    <div class="meter"><div style="width:61%;background:var(--tint-mem)"></div></div>
  </div></div>

  <!-- 存储 -->
  <div class="row"><div class="row-head">
    <span class="icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--tint-sto)" stroke-width="1.3"><ellipse cx="7" cy="3.5" rx="5" ry="1.8"/><path d="M2 3.5v7c0 1 2.2 1.8 5 1.8s5-.8 5-1.8v-7"/><path d="M2 7c0 1 2.2 1.8 5 1.8S12 8 12 7"/></svg></span>
    <span class="label">存储:</span><span class="value mono">72%</span>
    <span class="spacer"></span>
    <div class="meter"><div style="width:72%;background:var(--tint-sto)"></div></div>
  </div></div>

  <!-- 网络 -->
  <div class="row"><div class="row-head">
    <span class="icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--tint-net)" stroke-width="1.3" stroke-linecap="round"><path d="M1.5 5.5a8 8 0 0 1 11 0M3.5 8a5 5 0 0 1 7 0M5.5 10.4a2.2 2.2 0 0 1 3 0"/><circle cx="7" cy="12.2" r="0.8" fill="var(--tint-net)" stroke="none"/></svg></span>
    <span class="label">网络:</span><span class="value mono">Wi-Fi</span>
    <span class="spacer"></span>
    <span class="pill mono"><span class="psym">↓</span>1.2 MB/s</span>
    <span class="pill mono"><span class="psym">↑</span>86 KB/s</span>
  </div></div>

  <!-- ============ 电源行（展开态，新功能载体） ============ -->
  <div class="row" id="battery-row">
    <div class="row-head">
      <span class="icon" id="bat-icon"></span>
      <span class="label">电源:</span><span class="value mono" id="bat-summary">82%</span>
      <span class="spacer"></span>
      <span class="pill mono" id="pill-chg-wrap"><span class="psym">⚡︎</span><span id="pill-chg">30.4W</span></span>
      <span class="pill mono"><span class="psym">◔</span><span id="pill-pwr">24.6W</span></span>
    </div>

    <div class="detail">
      <div class="sep"></div>

      <!-- 既有区块：两列指标网格（健康度/循环/温度/损耗，位置与正式版一致，紧跟分隔线） -->
      <div class="grid">
        <div class="gcell"><span class="gl">健康度</span><span class="gv mono">92%</span></div>
        <div class="gcell"><span class="gl">循环次数</span><span class="gv mono">118</span></div>
        <div class="gcell"><span class="gl">温度</span><span class="gv mono" id="g-temp">31°C</span></div>
        <div class="gcell"><span class="gl">转换损耗</span><span class="gv mono" id="g-loss">3.2 W</span></div>
      </div>

      <!-- 区块 A：功率流（带分区标题，明确隔离上方指标网格） -->
      <div class="sec-title">功率流</div>
      <div class="flow">
        <div class="flow-diagram">
          <svg class="edges" id="edges" viewBox="0 0 272 108"></svg>
          <div class="fnode" id="fn-adapter">
            <div class="fh">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.1" stroke-linecap="round"><path d="M3 1v2.4M7 1v2.4M2.2 3.4h5.6v1.8a2.8 2.8 0 0 1-5.6 0z" /><path d="M5 8v1.4"/></svg>
              <div class="fl" id="fa-label">适配器 · 96W</div>
            </div>
            <div class="fv mono" id="fa-value">58.2<span class="u">W</span></div>
            <div class="fbar"><div id="fa-bar" style="width:60%"></div></div>
          </div>
          <div class="fnode" id="fn-system">
            <div class="fh">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.1"><rect x="2" y="2" width="6" height="6" rx="1.2"/><rect x="4" y="4" width="2" height="2" rx="0.4" fill="rgba(255,255,255,0.75)" stroke="none"/></svg>
              <div class="fl">系统负载</div>
            </div>
            <div class="fv mono" id="fs-value">24.6<span class="u">W</span></div>
          </div>
          <div class="fnode" id="fn-battery">
            <div class="fh">
              <svg width="12" height="9" viewBox="0 0 12 9" fill="none"><rect x="0.6" y="1.6" width="9" height="5.8" rx="1.4" stroke="rgba(255,255,255,0.75)" stroke-width="1"/><rect x="1.8" y="2.8" width="6.6" height="3.4" rx="0.7" fill="rgba(255,255,255,0.55)" id="fb-fill"/><path d="M10.4 3.2v2.6c.7-.2 1-.6 1-1.3s-.3-1.1-1-1.3z" fill="rgba(255,255,255,0.75)"/></svg>
              <div class="fl">电池</div>
            </div>
            <div class="fv mono" id="fb-value">+30.4<span class="u">W</span></div>
          </div>
        </div>
        <div class="flow-note" id="flow-note"></div>
      </div>

      <!-- 区块 B：耗电排行 = 进程行（CPU 能耗估算）+ 子系统实测行（IOReport），合计对平系统负载 -->
      <div class="sec-title">耗电排行<span class="hint mono" id="proc-hint">进程为估算 · 硬件为实测</span></div>
      <div class="procs" id="procs"></div>
    </div>
  </div>
</div>

<!-- 原型控制（非产品 UI）-->
<div class="proto-ctl">
  <div class="proto-tabs" id="tabs">
    <button data-s="charging" class="active">充电中</button>
    <button data-s="battery">电池供电</button>
    <button data-s="insufficient">适配器不足</button>
  </div>
  <div class="proto-cap">原型场景切换 · 正式版由 BatteryPower 符号 + 电源连接状态自动判定</div>
</div>

<script>
/* ====== 设计令牌 ====== */
const TINT = { bat: '#65AF52', crit: '#D94848', warn: '#B8872E', white: 'rgba(255,255,255,0.85)' };

/* ====== 场景数据（结构与正式版数据链一致） ====== */
const SCENARIOS = {
  charging: {
    summary: '82%',
    adapter: { label: '适配器 · 96W', in: 58.2, max: 96, dimmed: false },
    system: 24.6,
    battery: { w: 30.4, dir: 'in', level: 0.82 },
    loss: 3.2, temp: 31,
    note: () => `约 52 分钟充满`,
    noteCrit: false,
    icon: 'bolt',
    procs: [
      { icon: '🌐', name: 'Google Chrome', w: 4.2 },
      { icon: '🔨', name: 'Xcode', w: 3.1 },
      { icon: '🪟', name: 'WindowServer', w: 1.6 },
      { icon: '⚙️', name: 'kernel_task', w: 0.9 },
      null, /* 第 5 行横杠占位：数据未到不跳高度 */
    ],
    subs: [
      { icon: '▦', name: 'GPU 合计', w: 2.6 },

  battery: {
    summary: '76%',
    adapter: { label: '适配器', in: 0, max: 96, dimmed: true },
    system: 18.4,
    battery: { w: 18.7, dir: 'out', level: 0.76 },
    loss: 0.3, temp: 30,
    note: () => `预计可用 6 小时 20 分`,
    noteCrit: false,
    icon: 'b75',
    procs: [
      { icon: '🌐', name: 'Google Chrome', w: 3.4 },
      { icon: '🔨', name: 'Xcode', w: 2.2 },
      { icon: '🪟', name: 'WindowServer', w: 1.3 },
      { icon: '⚙️', name: 'kernel_task', w: 0.7 },
      { icon: '♪', name: 'Music', w: 0.4 },
    ],
    subs: [
      { icon: '▦', name: 'GPU 合计', w: 1.9 },
      { icon: '◧', name: '屏幕及其他硬件', w: 8.5 },
    ],
  },
  insufficient: {
    summary: '64%',
    adapter: { label: '已达上限', in: 29.8, max: 30, dimmed: false, maxed: true },
    system: 41.5,
    battery: { w: 12.4, dir: 'out', crit: true, level: 0.64 },
    loss: 0.7, temp: 36,
    note: null,
    noteCrit: false,
    icon: 'b50',
    procs: [
      { icon: '🔨', name: 'Xcode（编译中）', w: 14.8, hot: true },
      { icon: '🌐', name: 'Google Chrome', w: 4.6 },
      { icon: '🪟', name: 'WindowServer', w: 2.1 },
      { icon: '⚙️', name: 'kernel_task', w: 1.1 },
      { icon: '◦', name: '其他进程', w: 2.4 },
    ],
    subs: [

    ],
  },
};
let current = 'charging';

/* ====== 电池 SF Symbol 近似图标（行头） ====== */
const BAT_ICONS = {
  bolt: `<svg width="16" height="14" viewBox="0 0 16 14" fill="none"><rect x="0.7" y="3.7" width="12" height="6.6" rx="1.8" stroke="${TINT.bat}" stroke-width="1.2"/><rect x="2" y="5" width="9.4" height="4" rx="0.9" fill="${TINT.bat}"/><path d="M14.4 5.6v2.8c.9-.2 1.3-.7 1.3-1.4s-.4-1.2-1.3-1.4z" fill="${TINT.bat}"/><path d="M7.4 3.2 5.2 7h1.7l-.7 3.6L9 6.6H7.2l.9-3.4z" fill="#fff" stroke="rgba(0,0,0,0.45)" stroke-width="0.5"/></svg>`,
  b75:  `<svg width="16" height="14" viewBox="0 0 16 14" fill="none"><rect x="0.7" y="3.7" width="12" height="6.6" rx="1.8" stroke="${TINT.bat}" stroke-width="1.2"/><rect x="2" y="5" width="7" height="4" rx="0.9" fill="${TINT.bat}"/><path d="M14.4 5.6v2.8c.9-.2 1.3-.7 1.3-1.4s-.4-1.2-1.3-1.4z" fill="${TINT.bat}"/></svg>`,
  b50:  `<svg width="16" height="14" viewBox="0 0 16 14" fill="none"><rect x="0.7" y="3.7" width="12" height="6.6" rx="1.8" stroke="${TINT.bat}" stroke-width="1.2"/><rect x="2" y="5" width="4.8" height="4" rx="0.9" fill="${TINT.bat}"/><path d="M14.4 5.6v2.8c.9-.2 1.3-.7 1.3-1.4s-.4-1.2-1.3-1.4z" fill="${TINT.bat}"/></svg>`,
};

/* ====== 功率流几何：节点锚点（与 .fnode 定位对应） ======
   适配器右缘(90,33) 系统左缘(182,33) 汇合竖轴 x=136 电池上缘(136,64) */
const P = { aOut: [90, 33], sIn: [182, 33], jx: 136, bTop: 64 };
/* 带圆角的正交路径 */
const PATHS = {
  a2s: `M${P.aOut[0]} ${P.aOut[1]} L${P.sIn[0]} ${P.sIn[1]}`,
  a2b: `M${P.aOut[0]} ${P.aOut[1]} H${P.jx - 9} Q${P.jx} ${P.aOut[1]} ${P.jx} ${P.aOut[1] + 9} V${P.bTop}`,
  b2s: `M${P.jx} ${P.bTop} V${P.aOut[1] + 9} Q${P.jx} ${P.aOut[1]} ${P.jx + 9} ${P.aOut[1]} H${P.sIn[0]}`,
};

/* 功率 → 线宽 / 粒子参数 */
const flowWidth = (w) => Math.max(1.6, Math.min(4, 1.2 + w / 18));

/* 导管：底轨 + 渐变辉光层 + 流动虚线 + 彗星粒子 */
let uid = 0;
function conduit(pathD, watts, color, { glow = true } = {}) {
  const id = `f${uid++}`;
  const w = flowWidth(watts);
  const dur = Math.max(0.9, Math.min(4.5, 60 / Math.max(watts, 5)));
  const cometDur = Math.max(1.4, Math.min(6, 120 / Math.max(watts, 5)));
  const comets = Math.max(1, Math.min(3, Math.round(watts / 15)));

  let h = '';
  /* 底轨 */
  h += `<path d="${pathD}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${w + 2.4}" stroke-linecap="round"/>`;
  /* 辉光层 */
  if (glow) {
    h += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="${w + 2}" stroke-linecap="round" stroke-opacity="0.16" filter="url(#soft-glow)"/>`;
  }
  /* 常亮芯线 */
  h += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-opacity="0.30"/>`;
  /* 流动虚线（能量脉冲） */
  h += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-opacity="0.85"
          stroke-dasharray="7 15">
          <animate attributeName="stroke-dashoffset" from="22" to="0" dur="${dur.toFixed(2)}s" repeatCount="indefinite"/>
        </path>`;
  /* 彗星粒子：亮头 + 光晕 */
  for (let i = 0; i < comets; i++) {
    const begin = (-(cometDur / comets) * i).toFixed(2);
    h += `<circle r="${(w * 0.75).toFixed(2)}" fill="#fff" opacity="0.9">
            <animateMotion dur="${cometDur.toFixed(2)}s" begin="${begin}s" repeatCount="indefinite" path="${pathD}"/>
          </circle>
          <circle r="${(w * 1.9).toFixed(2)}" fill="${color}" opacity="0.22" filter="url(#soft-glow)">
            <animateMotion dur="${cometDur.toFixed(2)}s" begin="${begin}s" repeatCount="indefinite" path="${pathD}"/>
          </circle>`;
  }
  return h;
}

/* 静默底轨（无流动） */
const idleTrack = (pathD) =>
  `<path d="${pathD}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3" stroke-linecap="round"/>`;

function renderEdges(key) {
  const s = SCENARIOS[key];
  uid = 0;
  let h = `<defs>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>`;

  if (key === 'charging') {
    h += conduit(PATHS.a2s, s.system, TINT.white);
    h += conduit(PATHS.a2b, s.battery.w, TINT.bat);
  } else if (key === 'battery') {
    h += idleTrack(PATHS.a2s.replace(`M${P.aOut[0]}`, `M${P.aOut[0]}`));
    h += conduit(PATHS.b2s, s.battery.w, TINT.bat);
  } else {
    h += conduit(PATHS.a2s, s.adapter.in, TINT.warn);
    h += conduit(PATHS.b2s, s.battery.w, TINT.crit);
  }
  /* 汇合节点 */
  h += `<circle cx="${P.jx}" cy="${P.aOut[1]}" r="2" fill="#fff" opacity="0.28"/>`;
  document.getElementById('edges').innerHTML = h;
}

/* ====== 数值补间：切换场景时瓦数平滑滚动 ====== */
const tweens = new Map();
function tweenNumber(el, target, fmt, durMs = 450) {
  const prev = tweens.get(el) ?? { value: target };
  const from = prev.value;
  if (prev.raf) cancelAnimationFrame(prev.raf);
  const t0 = performance.now();
  const state = { value: from, raf: 0 };
  tweens.set(el, state);
  const step = (now) => {
    const t = Math.min(1, (now - t0) / durMs);
    const eased = 1 - Math.pow(1 - t, 3);
    state.value = from + (target - from) * eased;
    el.innerHTML = fmt(state.value);
    if (t < 1) state.raf = requestAnimationFrame(step);
  };
  state.raf = requestAnimationFrame(step);
}
const wattHTML = (v) => `${v.toFixed(1)}<span class="u">W</span>`;

/* ====== 数值渲染 ====== */
const $ = (id) => document.getElementById(id);
function renderValues(key) {
  const s = SCENARIOS[key];

  $('bat-icon').innerHTML = BAT_ICONS[s.icon];
  $('bat-summary').textContent = s.summary;
  /* 双 pill 语义与正式版一致：⚡=充电功率（非充电显 -），◔=整机功耗 */
  $('pill-chg-wrap').classList.toggle('charging', s.battery.dir === 'in');
  $('pill-chg').textContent = s.battery.dir === 'in' ? `${s.battery.w.toFixed(1)}W` : '-';
  $('pill-pwr').textContent = `${s.system.toFixed(1)}W`;

  const fa = $('fn-adapter');
  fa.classList.toggle('dimmed', s.adapter.dimmed);
  fa.classList.toggle('alert', !!s.adapter.maxed);
  $('fa-label').textContent = s.adapter.label;
  if (s.adapter.dimmed) {
    $('fa-value').innerHTML = '—';
    $('fa-bar').style.width = '0%';
  } else {
    tweenNumber($('fa-value'), s.adapter.in, wattHTML);
    $('fa-bar').style.width = `${Math.min(100, (s.adapter.in / s.adapter.max) * 100)}%`;
  }

  $('fn-system').classList.toggle('alert', key === 'insufficient');
  tweenNumber($('fs-value'), s.system, wattHTML);

  const fb = $('fn-battery');
  fb.classList.toggle('glow-charge', s.battery.dir === 'in');
  fb.classList.toggle('glow-drain', s.battery.dir === 'out' && !s.battery.crit);
  fb.classList.toggle('alert', !!s.battery.crit);
  const sign = s.battery.dir === 'in' ? '+' : '−';
  tweenNumber($('fb-value'), s.battery.w, (v) => `${sign}${wattHTML(v)}`);
  /* 电池图标电芯填充随电量（仅示意，不重复展示百分比数字） */
  $('fb-fill').setAttribute('width', (6.6 * s.battery.level).toFixed(2));
  $('fb-fill').setAttribute('fill', s.battery.crit ? 'rgba(217,72,72,0.75)' : 'rgba(255,255,255,0.55)');

  const note = $('flow-note');
  const noteText = s.note ? s.note(s) : null;
  note.style.display = noteText ? 'block' : 'none';
  note.textContent = noteText ?? '';
  note.classList.toggle('crit', s.noteCrit);

  /* 耗电排行：进程行（固定 5 行，空位横杠占位）+ 分隔线 + 子系统实测行。
     条形基线用全列表最大值，保证进程/子系统条形可横向比较。 */
  const real = s.procs.filter(Boolean);
  const maxW = Math.max(...real.map((p) => p.w), ...s.subs.map((p) => p.w));
  const procRows = s.procs.map((p) => {
    if (!p) {
      return `<div class="prow placeholder">
        <div class="picon" style="background:rgba(255,255,255,0.04)"></div>
        <div class="pname" style="flex:0 0 90px">—</div>
        <div class="ptrack"></div>
        <div class="pw mono">—</div>
      </div>`;
    }
    return `<div class="prow${p.hot ? ' hot' : ''}">
      <div class="picon">${p.icon}</div>
      <div class="pname" style="flex:0 0 90px">${p.name}</div>
      <div class="ptrack"><div class="pbar" style="width:${(p.w / maxW) * 100}%"></div></div>
      <div class="pw mono">${p.w.toFixed(1)}W</div>
    </div>`;
  }).join('');
  const subRows = s.subs.map((p) => `
    <div class="prow sub">
      <div class="picon">${p.icon}</div>
      <div class="pname" style="flex:0 0 90px">${p.name}</div>
      <div class="ptrack"><div class="pbar" style="width:${(p.w / maxW) * 100}%"></div></div>
      <div class="pw mono">${p.w.toFixed(1)}W</div>
    </div>`).join('');
  $('procs').innerHTML = procRows + '<div class="sub-sep"></div>' + subRows;

  $('g-temp').textContent = `${s.temp}°C`;
  $('g-loss').textContent = `${s.loss.toFixed(1)} W`;
}

/* ====== 场景切换 ====== */
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.s === current) return;
  current = btn.dataset.s;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b === btn));
  renderEdges(current);
  renderValues(current);
});

/* 面板头时钟 */
function tick() {
  const d = new Date();
  $('clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
setInterval(tick, 1000);

tick();
renderEdges(current);
renderValues(current);
</script>
