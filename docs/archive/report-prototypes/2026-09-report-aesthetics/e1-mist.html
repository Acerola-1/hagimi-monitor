<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统监控报告</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e20" media="(prefers-color-scheme: dark)">
<script>
  // 主题解析:?theme=light|dark 强制(便于演示对比),否则跟随系统并实时联动
  (function () {
    const q = new URLSearchParams(location.search).get("theme");
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const apply = () => { document.documentElement.dataset.theme = q || (mq.matches ? "dark" : "light"); };
    mq.addEventListener("change", apply);
    apply();
  })();
</script>
<style>
  /* ── 雾窗 MIST:正式选定方向。
       品牌色 = 黑 + 绿(与图标/宣传图一致);顶部氛围雾与标题尾字渐变 = 浅蓝(沿用旧报表头部观感)。
       层级手法:固定浅蓝雾(渐隐) + 渐变标题字 + 毛玻璃顶栏/时间栏 + 侧栏加深半档。
       层级靠"明度分层":雾(氛围层) → 磨砂栏(结构层) → 卡片(内容层)。 */
  :root[data-theme="light"] {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --panel-2: #fafafc;
    --rail-bg: rgba(0, 0, 0, 0.04);
    --line: rgba(0, 0, 0, 0.1);
    --line-soft: rgba(0, 0, 0, 0.055);
    --sel: rgba(0, 0, 0, 0.055);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --accent: #16a34a;
    --accent-soft: rgba(22, 163, 74, 0.1);
    /* 氛围雾:核心光团(左上) + 顶部薄雾洗层,浅蓝 */
    --mist-core: rgba(56, 189, 248, 0.3);
    --mist-wash: rgba(56, 189, 248, 0.14);
    --mark-glow: rgba(22, 163, 74, 0.35);
    /* 图表数据色:Apple 浅色系统色 */
    --c-cpu: #007aff; --c-gpu: #af52de; --c-mem: #30b0c7; --c-net: #009e8f;
    --c-disk: #d69e00; --c-batt: #34c759; --c-thermal: #ff3b30; --c-power: #ff9500;
    --chart-grid: rgba(0, 0, 0, 0.06);
    --chart-label: #a1a1a8;
    --chart-cross: rgba(0, 0, 0, 0.28);
    --card: #ffffff;
    --ring-track: rgba(0, 0, 0, 0.07);
    --ring-arc: #16a34a;
    --heat: #16a34a;
    --tip-bg: rgba(255, 255, 255, 0.98);
    --seg-track: #e8e8eb;
    --seg-knob: #ffffff;
    --zebra: rgba(0, 0, 0, 0.022);
    /* 应用排行字母砖的明度档位(深色案覆写) */
    --tile-s: 48%; --tile-bg-l: 93%; --tile-tx-l: 34%;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e1e20;
    --panel: #2b2b2e;
    --panel-2: #323235;
    --rail-bg: rgba(0, 0, 0, 0.16);
    --line: rgba(255, 255, 255, 0.12);
    --line-soft: rgba(255, 255, 255, 0.07);
    --sel: rgba(255, 255, 255, 0.09);
    --text: #f5f5f7;
    --text-2: #a0a0a6;
    --text-3: #6d6d74;
    --accent: #4ade80;
    --accent-soft: rgba(74, 222, 128, 0.16);
    --mist-core: rgba(56, 189, 248, 0.26);
    --mist-wash: rgba(56, 189, 248, 0.12);
    --mark-glow: rgba(74, 222, 128, 0.4);
    /* 图表数据色:Apple 深色系统色 */
    --c-cpu: #2997ff; --c-gpu: #bf5af2; --c-mem: #64d2ff; --c-net: #70d7c7;
    --c-disk: #ffd60a; --c-batt: #30d158; --c-thermal: #ff453a; --c-power: #ff9f0a;
    --chart-grid: rgba(255, 255, 255, 0.08);
    --chart-label: rgba(255, 255, 255, 0.4);
    --chart-cross: rgba(255, 255, 255, 0.32);
    --card: #2b2b2e;
    --ring-track: rgba(255, 255, 255, 0.1);
    --ring-arc: #4ade80;
    --heat: #4ade80;
    --tip-bg: rgba(44, 44, 46, 0.98);
    --seg-track: #38383b;
    --seg-knob: #5c5c60;
    --zebra: rgba(255, 255, 255, 0.03);
    --tile-s: 38%; --tile-bg-l: 25%; --tile-tx-l: 76%;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* 键盘焦点可见性:统一绿色描边 */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }

  /* 氛围雾:固定于视口顶部,核心光团偏左(照亮品牌区),洗层向下渐隐;
     内容滚动时雾不动,卡片滑过雾面形成稳定"舞台" */
  .mist {
    position: fixed; top: 0; left: 0; right: 0; height: 250px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(640px 220px at 10% -70px, var(--mist-core), transparent 68%),
      linear-gradient(180deg, var(--mist-wash), transparent 82%);
  }

  .shell { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

  /* ── 顶栏:半透明 + 背景模糊,让雾透上来;标题字渐变 ── */
  .top {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    gap: 14px 28px; flex-wrap: wrap; padding: 18px 30px 15px;
    border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 46%, transparent);
    backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark svg { width: 30px; height: 30px; display: block; color: var(--accent); filter: drop-shadow(0 2px 9px var(--mark-glow)); }
  .mark .mark-bg { fill: var(--accent-soft); stroke: none; }
  /* 标题上方的英文小字刊名(沿用旧报表) */
  .kicker {
    font: 600 9px/1 "SF Mono", ui-monospace, monospace; letter-spacing: 2.6px;
    color: var(--text-3); margin-bottom: 6px;
  }
  /* 标题渐变:整体保持正文黑,仅尾部落入浅蓝(沿用旧报表"最后两字浅蓝"的观感) */
  .brand h1 {
    margin: 0; font-size: 19px; font-weight: 650; letter-spacing: 0;
    background: linear-gradient(100deg, var(--text) 62%, #38bdf8 108%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 0; }
  .chip {
    font-size: 12px; color: var(--text-2); padding: 6px 13px;
    border-left: 1px solid var(--line-soft); font-variant-numeric: tabular-nums;
  }
  .chip:first-child { border-left: 0; color: var(--text); font-weight: 550; }

  .workspace { flex: 1; min-height: 0; display: flex; }

  /* ── 左栏:macOS 侧栏语感,选中 = 灰底圆角行;底色加深半档与主区拉开 ── */
  .rail {
    width: 200px; flex: none; display: flex; flex-direction: column; background: var(--rail-bg);
    border-right: 1px solid var(--line-soft); overflow-y: auto; padding: 18px 10px 16px;
  }
  .rail-group { margin-bottom: 20px; }
  .rail-eyebrow {
    font-size: 11px; font-weight: 600; color: var(--text-3); padding: 0 10px 7px;
  }
  .rail-nav a {
    display: flex; align-items: center; gap: 9px; margin: 1px 0;
    padding: 6px 10px; border-radius: 7px; text-decoration: none; color: var(--text-2);
    font-size: 13px; font-weight: 450; transition: background 0.12s ease, color 0.12s ease;
  }
  .rail-nav a:hover { color: var(--text); }
  .rail-nav a.active { background: var(--sel); color: var(--text); font-weight: 550; }
  .rail-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); flex: none; opacity: 0.6; }
  .rail-nav a.active .rail-dot { background: var(--accent); opacity: 1; }
  .rail-label { flex: 1; }
  .rail-badge {
    font-size: 10.5px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums;
    background: var(--accent-soft); border-radius: 99px; padding: 2.5px 7px;
  }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ── 时间栏:macOS 分段控件(灰槽 + 滑动白钮);半透明让雾连续 ── */
  .filters {
    position: relative; flex: none; display: flex; align-items: center; gap: 14px;
    padding: 11px 30px; border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 34%, transparent);
    backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  }
  .filter-title { font-size: 12px; font-weight: 550; color: var(--text-2); }
  .ranges { display: inline-flex; background: var(--seg-track); border-radius: 8px; padding: 2px; }
  .ranges button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: var(--text-2); padding: 5px 15px; border-radius: 6.5px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .ranges button:hover { color: var(--text); }
  .ranges button.active {
    background: var(--seg-knob); color: var(--text); font-weight: 550;
    box-shadow: 0 0.5px 2.5px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.03);
  }
  .filter-gran { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
  .nav-progress {
    position: absolute; left: 0; bottom: -1px; height: 1.5px; width: 0;
    background: var(--accent); transition: width 0.1s linear;
  }

  /* ── 自定义范围弹层:原生面板 ── */
  .ranges { position: relative; }
  .custom-pop {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 40;
    display: flex; align-items: flex-end; gap: 10px; padding: 13px 14px;
    background: var(--tip-bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16); white-space: nowrap;
  }
  .custom-pop[hidden] { display: none; }
  .custom-pop label { display: flex; flex-direction: column; gap: 5px; font-size: 10.5px; font-weight: 550; color: var(--text-3); }
  .custom-pop input {
    font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums;
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px;
  }
  .cust-apply {
    appearance: none; border: 0; cursor: pointer; border-radius: 7px;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 6.5px 15px;
  }
  .cust-apply:hover { filter: brightness(1.06); }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  .content { max-width: 1140px; margin: 0 auto; padding: 28px 30px 64px; }
  section { scroll-margin-top: 14px; }

  /* ── 模块头:小序号 + 系统字标题 + 发丝线 ── */
  .mod { margin-bottom: 40px; }
  .mod-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 11px; margin-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
  .mod-head .idx { font-size: 12px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .mod-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .mod-head .sub { font-size: 12px; color: var(--text-3); }
  .mod-head .count { margin-left: auto; font-size: 11px; color: var(--text-3); }

  /* ── 卡片:白/深灰底 + 发丝描边,无 hover 位移 ── */
  .card {
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: 11px; padding: 18px 20px 15px;
  }
  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .card-head h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text); }
  .card-head .hint { margin-left: auto; font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }

  /* ── 总览:评分 + KPI ── */
  .ov-grid { display: grid; grid-template-columns: 330px 1fr; gap: 14px; margin-bottom: 14px; }
  .score-card { display: flex; flex-direction: column; }
  .score-body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 6px; }
  .score-ring { position: relative; width: 126px; height: 126px; }
  .score-ring svg { width: 100%; height: 100%; }
  .score-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .score-num { font-size: 38px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
  .score-level { font-size: 11.5px; color: var(--accent); margin-top: 7px; font-weight: 550; }
  .score-dims { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .dim {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-2); padding: 4.5px 11px;
    background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 99px;
  }
  .dim i { width: 5px; height: 5px; border-radius: 50%; }
  .dim-good i { background: var(--c-batt); }
  .dim-warn i { background: var(--c-power); }
  .dim em { font-style: normal; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 12px 14px 10px; display: flex; flex-direction: column;
  }
  .kpi-label { font-size: 10.5px; font-weight: 600; color: var(--text-2); }
  .kpi-value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; margin-top: 8px; }
  .kpi-sub { font-size: 10.5px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi-spark { margin-top: auto; padding-top: 9px; height: 30px; }
  .kpi-spark svg { width: 100%; height: 100%; display: block; }

  /* ── 图表:坐标轴也只用系统小字 ── */
  .chart { position: relative; height: 280px; }
  .chart.tall { height: 320px; }
  .chart.short { height: 210px; }
  .axis-x, .axis-y { font: 500 9.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; z-index: 5;
    background: var(--tip-bg); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 11px; min-width: 108px; transition: opacity 0.12s ease;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.14);
  }
  .tip-title { font-size: 10.5px; font-weight: 600; color: var(--text-3); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .tip-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-2); padding: 2.5px 0; }
  .tip-row i { width: 6px; height: 6px; border-radius: 2px; }
  .tip-row b { margin-left: auto; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── 热力图 ── */
  .heat-grid { display: grid; grid-template-columns: 26px repeat(24, 1fr); gap: 3px; }
  .heat-h, .heat-d { font-size: 9px; color: var(--text-3); align-self: center; font-variant-numeric: tabular-nums; }
  .heat-d { text-align: right; padding-right: 6px; }
  .heat-cell { display: block; aspect-ratio: 1.35; border-radius: 2.5px; background: var(--heat); }
  .heat-cell:hover { outline: 1px solid var(--accent); outline-offset: 1px; }
  .heat-scale { width: 90px; height: 7px; border-radius: 4px; background: linear-gradient(90deg, var(--accent-soft), var(--accent)); }

  /* ── 模块主体:主列 + 右栏规格 ── */
  .mod-body { display: grid; grid-template-columns: minmax(0, 1fr) 288px; gap: 14px; align-items: start; }
  .mod-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .spec {
    position: sticky; top: 0; background: var(--panel);
    border: 1px solid var(--line-soft); border-radius: 11px; padding: 15px 17px 11px;
  }
  .spec-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 10px; margin-bottom: 2px; border-bottom: 1px solid var(--line-soft); }
  .spec-head .t { font-size: 12.5px; font-weight: 650; }
  .spec-head .src { margin-left: auto; font-size: 10px; color: var(--text-3); }
  .spec-group { padding-top: 10px; }
  .spec-group-name {
    display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
  }
  .spec-group-name .rt { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--c-batt); }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--c-batt); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .spec-row { display: flex; align-items: baseline; gap: 10px; padding: 4.5px 7px; border-radius: 6px; font-size: 12px; }
  .spec-row:nth-child(odd) { background: var(--zebra); }
  .spec-row .k { color: var(--text-3); }
  .spec-row .v { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

  /* ── 本机 ── */
  .machine { padding: 16px 20px 18px; }
  .m-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
  .m-tab {
    appearance: none; cursor: pointer; border: 1px solid var(--line-soft); border-radius: 99px;
    background: transparent; color: var(--text-2); font-size: 12px; font-weight: 500;
    padding: 6px 14px; transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .m-tab:hover { color: var(--text); border-color: var(--line); }
  .m-tab.active { color: var(--accent); border-color: transparent; background: var(--accent-soft); font-weight: 600; }
  .m-pane-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 13px; }
  .m-pane-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .m-pane-head .sub { font-size: 11.5px; color: var(--text-3); }
  .m-pane-head .count { margin-left: auto; font-size: 11px; color: var(--text-3); }
  .m-pane-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .m-group { border: 1px solid var(--line-soft); border-radius: 9px; padding: 12px 14px 8px; }
  .m-group h4 { margin: 0 0 7px; font-size: 11px; font-weight: 600; color: var(--text-3); }

  /* ── 应用排行 ── */
  .apps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .rank-list { display: flex; flex-direction: column; }
  .rank-row { display: flex; align-items: center; gap: 11px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .rank-row:last-child { border-bottom: 0; }
  .rank-no { font-size: 10.5px; color: var(--text-3); width: 18px; font-variant-numeric: tabular-nums; }
  .rank-tile {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    background: hsl(var(--tile-h) var(--tile-s) var(--tile-bg-l));
    color: hsl(var(--tile-h) var(--tile-s) var(--tile-tx-l));
    border: 1px solid hsl(var(--tile-h) var(--tile-s) var(--tile-tx-l) / 0.22);
  }
  .rank-name { width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text-2); }
  .rank-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--zebra); overflow: hidden; }
  .rank-bar i { display: block; height: 100%; border-radius: 2px; transition: width 0.5s ease; }
  .rank-val { flex: none; min-width: 64px; text-align: right; font-weight: 600; font-size: 11.5px; font-variant-numeric: tabular-nums; }

  /* ── 消息与洞察:severity 点不发光 ── */
  .events { display: flex; flex-direction: column; }
  .event {
    display: flex; align-items: baseline; gap: 13px; padding: 10px 2px;
    border-bottom: 1px solid var(--line-soft); font-size: 13px;
  }
  .event:last-child { border-bottom: 0; }
  .event i { width: 6px; height: 6px; border-radius: 50%; flex: none; align-self: center; }
  .sev-warn i { background: var(--c-power); }
  .sev-info i { background: var(--c-cpu); }
  .sev-ok i { background: var(--c-batt); }
