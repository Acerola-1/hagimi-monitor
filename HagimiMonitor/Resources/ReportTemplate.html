    const hasBattTemp = hasAny(rows, "batt_temp_avg");
    if (hasBattTemp) {
      series.push(lineSeries(I.sBattTemp, seriesData(rows, "batt_temp_avg"), C.battTemp, { yAxisIndex: 1 }));
      colors.push(C.battTemp);
    }
    // 风扇 RPM:仅 Direct 版(SMC 只读)。
    if (IS_DIRECT) {
      const hasFan = hasAny(rows, "fan_avg");
      if (hasFan) {
        series.push(lineSeries(I.sFanRPM, seriesData(rows, "fan_avg"), C.fan, { yAxisIndex: 2 }));
        colors.push(C.fan);
      }
    }
    if (!series.length) {
      setChart("ch-thermal", {}, rows, "cpu_thermal_avg");
      return;
    }
    const option = {
      backgroundColor: "transparent",
      textStyle: { fontFamily: FONT },
      color: colors,
      tooltip: Object.assign({}, liveTooltip(), {
        formatter: (params) => {
          let html = '<div style="opacity:.6;font-size:11px;margin-bottom:4px">'
            + fmtDate(params[0].value[0]) + " " + fmtClock(params[0].value[0]) + "</div>";
          params.forEach((p) => {
            let text;
            if (p.seriesName === I.sFanRPM) text = fmtRPM(p.value[1]);
            else if (p.seriesName === I.sThermalPressure) text = thermalStateText(p.value[1]);
            else text = p.value[1] == null ? "—" : p.value[1].toFixed(1) + "°C";
            html += "<div>" + p.marker + " " + p.seriesName + ": " + text + "</div>";
          });
          return html;
        },
      }),
      legend: { top: 4, right: 8, icon: "roundRect", itemWidth: 12, itemHeight: 4,
        textStyle: { color: C.label, fontSize: 11.5 } },
      // 三轴显式定位避免重叠:热压力独占左轴(0~3);温度与风扇分列右侧两轴,
      // 风扇轴再右移(offset)与温度轴错开,否则两条右轴刻度标签叠在一起看不清。
      // CPU 与电池温度同量纲共用一条温度轴即可分辨趋势,无需再拆。
      grid: Object.assign(timeGrid(), { right: 92 }),
      xAxis: baseAxis({ type: "time" }),
      yAxis: [
        baseAxis({ type: "value", min: 0, max: 3,
          axisLabel: {
            formatter: (val) => thermalStateText(val),
            color: C.label, fontSize: 10.5,
          },
          splitLine: { show: false } }),
        baseAxis({ type: "value", scale: true, position: "right",
          axisLabel: { formatter: (val) => val + "°C", color: C.label, fontSize: 11 } }),
        baseAxis({ type: "value", scale: true, splitLine: { show: false },
          position: "right", offset: 54,
          axisLabel: { formatter: (val) => (val / 1000) + "k", color: C.label, fontSize: 11 } }),
      ],
      dataZoom: [{ type: "inside" }],
      series,
    };
    const probe = hasThermal ? "cpu_thermal_avg" : IS_DIRECT && hasAny(rows, "cpu_temp_avg") ? "cpu_temp_avg" : "batt_temp_avg";
    setChart("ch-thermal", option, rows, probe);
  }

  function thermalStateText(state) {
    if (state == null) return "—";
    if (state < 0.5) return I.thermalNominal;
    if (state < 1.5) return I.thermalFair;
    if (state < 2.5) return I.thermalSerious;
    return I.thermalCritical;
  }

  function renderTable(rows, source) {
    // 日行优先;今日用分钟行现算,近 60 天内的小时数据兜底
    const dayMap = new Map();
    DATA.days.forEach((r) => {
      const d = new Date(timeOf(r));
      dayMap.set(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), r);
    });
    const list = [];
    const from = currentFrom, to = currentTo;
    // 步进用日历 setDate(+1) 推"下一天本地午夜",而非固定 +DAY:夏令时切换日相邻
    // 两午夜间隔 23/25 小时,固定步进会从此永远偏离本地午夜,dayMap.get 全部落空。
    // dailyTotals 已用 same 归一化,此处保持一致。
    for (let ts = startOfLocalDay(from); ts < to; ) {
      const next = new Date(ts);
      next.setDate(next.getDate() + 1);
      const nextTs = next.getTime();
      let row = dayMap.get(ts);
      if (!row && ts === startOfToday) {
        const minutes = rowsBetween(DATA.minutes, ts, Date.now());
        if (minutes.length) row = minutes.reduce(aggregateReduce, blankRow(ts));
      }
      if (!row && source !== "days") {
        const hours = rowsBetween(DATA.hours, ts, nextTs);
        if (hours.length) row = hours.reduce(aggregateReduce, blankRow(ts));
      }
      if (row) list.push(row);
      ts = nextTs;
    }
    const head = [
      I.colDay, I.colCpuAvg, I.colCpuPeak, I.colMemAvg, I.colMemPressure,
      I.colNetDown, I.colNetUp, I.colDiskRead, I.colDiskWrite,
      I.colAC, I.colPowerAvg, I.colCoverage,
    ];
    const table = el("table");
    const thead = el("thead");
    const trh = el("tr");
    head.forEach((h) => { const th = el("th"); th.textContent = h; trh.appendChild(th); });
    thead.appendChild(trh);
    table.appendChild(thead);
    const tbody = el("tbody");
    [...list].reverse().forEach((r) => {
      const tr = el("tr");
      const ac = v(r, "ac_frac");
      const cells = [
        [fmtDate(timeOf(r)), "day"],
        [fmtPct(v(r, "cpu_avg")), ""],
        [fmtPct(v(r, "cpu_max")), ""],
        [fmtPct(v(r, "mem_pct_avg")), ""],
        [fmtPct(v(r, "mem_pressure_avg")), ""],
        [fmtBytes(v(r, "net_down")), ""],
        [fmtBytes(v(r, "net_up")), ""],
        [fmtBytes(v(r, "disk_read")), ""],
        [fmtBytes(v(r, "disk_write")), ""],
        [ac == null ? "—" : fmtPct(ac * 100, 0), ""],
        [fmtW(v(r, "power_avg")), ""],
        [fmtHours(coverSeconds(r)), ""],
      ];
      cells.forEach(([text, cls]) => {
        const td = el("td");
        if (cls) td.className = cls;
        td.textContent = text;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    $("tbl").innerHTML = "";
    if (!list.length) {
      $("e-table").style.display = "block";
      return;
    }
    $("e-table").style.display = "none";
    $("tbl").appendChild(table);
  }

  function blankRow(ts) {
    const r = [Math.floor(ts / 1000)];
    for (let i = 0; i < COLS.length; i++) r.push(null);
    r.push(0);
    return r;
  }
  function aggregateReduce(acc, r) {
    const weightA = frames(acc), weightB = frames(r);
    COLS.forEach((c, i) => {
      const a = acc[i + 1], b = r[i + 1];
      if (b == null) return;
      const kind = AGG[c];
      if (kind === "sum") {
        acc[i + 1] = (a || 0) + b;
      } else if (kind === "max") {
        acc[i + 1] = a == null ? b : Math.max(a, b);
      } else {
        // 均值/占比按帧数加权合并
        if (a == null) acc[i + 1] = b;
        else if (weightA + weightB === 0) acc[i + 1] = (a + b) / 2;
        else acc[i + 1] = (a * weightA + b * weightB) / (weightA + weightB);
      }
    });
    acc[NIX] = weightA + weightB;
    return acc;
  }
  const AGG = {};
  COLS.forEach((c) => {
    AGG[c] = /(_avg|_frac)$/.test(c) ? "avg" : /(_max|_peak)$/.test(c) ? "max" : "sum";
  });

  function renderInsights(rows, source) {
    const box = $("insights");
    box.innerHTML = "";
    const items = [];
    const cpuAvg = avgOf(rows, "cpu_avg");
    if (cpuAvg != null) {
      const level = cpuAvg < 20 ? I.insLoadLow : cpuAvg < 50 ? I.insLoadMid : I.insLoadHigh;
      items.push(["health", "c-accent", I.insLoadTitle,
        t("insLoad", { v: cpuAvg.toFixed(1) }) + " — " + level]);
    }
    let peak = null;
    rows.forEach((r) => {
      const x = v(r, "cpu_max");
      if (x != null && (!peak || x > peak[1])) peak = [timeOf(r), x];
    });
    if (peak) {
      items.push(["cpu", "c-cpu", I.insPeakTitle,
        t("insPeak", { v: peak[1].toFixed(1), time: fmtDate(peak[0]) + " " + fmtClock(peak[0]) })]);
    }
    // 最忙时段:小时内数据(所选范围 ≤60 天时);分钟粒度范围也要把小时层裁到同一窗口
    if (source !== "days") {
      const hourRows = source === "minutes" ? rowsBetween(DATA.hours, currentFrom, currentTo) : rows;
      const slot = {};
      hourRows.forEach((r) => {
        const x = v(r, "cpu_avg");
        if (x == null) return;
        const h = new Date(timeOf(r)).getHours();
        if (!slot[h]) slot[h] = { sum: 0, n: 0 };
        slot[h].sum += x * frames(r);
        slot[h].n += frames(r);
      });
      let busiest = null;
      for (const h in slot) {
        const avg = slot[h].sum / slot[h].n;
        if (!busiest || avg > busiest[1]) busiest = [Number(h), avg];
      }
      if (busiest) {
        items.push(["alert", "c-thermal", I.insBusyTitle,
          t("insBusy", { v: String(busiest[0]).padStart(2, "0") + ":00–" + String((busiest[0] + 1) % 24).padStart(2, "0") + ":00", p: busiest[1].toFixed(1) })]);
      }
    }
    const netDown = sumOf(rows, "net_down");
    if (netDown != null) {
      items.push(["trend", "c-net", I.insNetTitle, t("insNet", { v: fmtBytes(netDown) })]);
    }
    const covered = rows.reduce((a, r) => a + coverSeconds(r), 0);
    const spanSeconds = (currentTo - currentFrom) / 1000;
    if (spanSeconds > 0) {
      items.push(["clock", "c-muted", I.insCoverageTitle,
        t("insCoverage", { v: Math.min(100, covered / spanSeconds * 100).toFixed(1), h: fmtHours(covered) })]);
    }
    items.forEach(([ic, cls, title, text]) => {
      const d = el("div", "insight " + cls);
      d.innerHTML = '<div class="insight-head">' + sf(ic) + '<div class="t"></div></div><div class="v"></div>';
      d.querySelector(".t").textContent = title;
      d.querySelector(".v").textContent = text;
      box.appendChild(d);
    });
  }

  function startOfLocalDay(ts) {
    const d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }

  // ── 主流程 ───────────────────────────────────────────────────
  let currentFrom = 0, currentTo = 0;
  let rowsCurrent = [];
  let currentSource = "hours";

  function applyRange() {
    document.querySelectorAll("#ranges button").forEach((b) => {
      b.classList.toggle("active", b.dataset.key === currentRange);
    });
    const rangeField = $("cal-range");
    rangeField.classList.toggle("active", !!custom);
    if (custom) rangeField.value = fmtDate(custom[0]) + " – " + fmtDate(custom[1] - 1);
    else { rangeField.value = ""; if (calPicker.selectedDates.length) calPicker.clear(); }
    // 跨日聚合板块(活动热力图、网络每日、磁盘每日)只在多维概览(周/月/自定义)
    // 才有价值—今日下热力图退化为单日、每日柱状只剩一根。今日时隐藏,其余范围恢复。
    const isToday = currentRange === "today";
    $("sec-heatmap").hidden = isToday;
    $("sec-net-daily").hidden = isToday;
    $("sec-disk-daily").hidden = isToday;
    // 时间栏左侧的当前档位说明:自选时显示范围控件本身的文案
    $("range-title").textContent = I.rangeLabel + " · "
      + (custom ? I.selectRange : (RANGES.find(([k]) => k === currentRange) || [null, ""])[1]);
    let from, to;
    if (custom) {
      [from, to] = custom;
    } else {
      [from, to] = RANGES.find(([k]) => k === currentRange)[2]();
    }
    currentFrom = from;
    currentTo = to;
    const source = pickSource(from, to);
    const rows = rowsBetween(DATA[source], from, to);
    rowsCurrent = rows;
    currentSource = source;

    renderHealth(rows);
    // 各分区隔离:单区异常不拖垮整页
    [renderApps, renderBatteryHealth].forEach((fn) => {
      try { fn(from, to); } catch (err) {
        console.error("render section failed:", err);
        const note = $("apps-none");
        if (note) { note.hidden = false; note.textContent = String(err && err.message || err); }
      }
    });
    renderKPI(rows);
    renderOverview(rows);
    renderCpu(rows);
    renderCpuPE(rows);
    renderCpuDist(rows);
    renderGpu(rows);
    renderGpuDist(rows);
    renderGpuMem(rows);
    renderMem(rows);
    renderNet(rows, source);
    renderNetDaily(rows);
    renderDisk(rows, source);
    renderDiskDaily(rows);
    renderPower(rows);
    renderBattery(rows);
    renderThermal(rows);
    renderEvents(rows, source);
    renderTable(rows, source);
    renderInsights(rows, source);

    const granLabel = source === "minutes" ? I.granMinute : source === "hours" ? I.granHour : I.granDay;
    $("h-overview").textContent = granLabel;
    $("h-cpu").textContent = granLabel;
    $("h-gpu").textContent = granLabel;
    $("h-mem").textContent = granLabel;
    $("h-net").textContent = granLabel;
    $("h-disk").textContent = granLabel;
    $("h-power").textContent = granLabel;
    $("h-thermal").textContent = granLabel;
    const heatDays = Math.round((to - from) / DAY);
    $("h-heatmap").textContent = t("heatHint", { d: heatDays });
    renderHeatmap(from, to);
  }

  // 整库无数据 → 空态页(模块栏与时间栏一并收起,只留空态说明)
  if (!DATA.minutes.length && !DATA.hours.length && !DATA.days.length) {
    $("content").hidden = true;
    $("rail").hidden = true;
    $("filters").hidden = true;
    $("blank").hidden = false;
    $("blank-title").textContent = I.blankTitle;
    $("blank-body").textContent = I.blankBody;
    return;
  }

  // 电池是否存在决定电池专属区块
  DATA.hasBattery = ["minutes", "hours", "days"].some((k) => hasAny(DATA[k], "batt_level_avg"));
  if (!DATA.hasBattery) {
    $("sec-batt").hidden = true;
  }

  applyRange();

  // ── 视觉增强:分区标题图标芯片 / 粘性导航 / 滚动进场 / 回到顶部 ──
  // 独立隔离:任何一步失败不影响已渲染的数据区。
  try {
    // 硬件模块块:把各模块板块收进「主列 + 右栏硬件规格」,并追加「本机」模块。
    // 单独再包一层 try:这一步失败时报表按原样可用,不会连累下面的视觉增强。
    try { buildHardwareLayout(); } catch (error) { console.warn("hardware layout failed", error); }

    // 分区标题图标包进同色芯片,层次更现代
    document.querySelectorAll(".sec-head").forEach((head) => {
      if (head.querySelector(".icon-chip")) return;
      const mark = head.querySelector(":scope > .sf");
      if (!mark) return;
      const chip = el("span", "icon-chip");
      const colorClass = Array.from(mark.classList).find((c) => c.startsWith("c-"));
      if (colorClass) {
        chip.classList.add(colorClass);
        mark.classList.remove(colorClass);
      } else if (mark.style.color) {
        chip.style.color = mark.style.color;
        mark.style.color = "";
      }
      head.insertBefore(chip, mark);
      chip.appendChild(mark);
    });

    // 左侧模块栏:固定六条核心硬件,其余板块(评分/走势/概览/热力图/应用/热压力/
    // 告警/明细/洞察)顺次出现在正文里、不进栏。点击与滚动高亮都作用在内层滚动
    // 容器上(导航与时间栏都在滚动容器之外,任何窗口高度下都常驻可见)。
    const railNav = $("module-nav");
    const navProgress = $("nav-progress");
    const scroller = $("scroller");
    $("rail-eyebrow").textContent = I.railEyebrow;
    $("rail-footer").innerHTML = '<span class="status-dot"></span>' + I.railLocal
      + "<small>" + [DATA.meta.model, DATA.meta.os].filter(Boolean).join(" · ") + "</small>";
    // 栏内用模块短名(与面板/设置页的模块名一致),不用板块全称(内存构成/磁盘读写速率…)
    const railLinks = [
      ["sec-cpu", I.kCpu, "cpu"],
      ["sec-gpu", I.kGpu, "gpu"],
      ["sec-mem", I.kMem, "mem"],
      ["sec-net", I.railNet, "net"],
      ["sec-disk", I.railDisk, "disk"],
      ["sec-power", I.railPower, "power"],
      ["mod-machine", I.kThisMac, "device"],
    ].map(([id, label, iconKey]) => {
      // 模块板块已被收进 .module-block,左栏与滚动高亮都应以整块为单位,
      // 否则高亮会在模块内部各板块之间来回跳。
      const sec = $(id) && ($(id).closest(".module-block") || $(id));
      if (!sec) return null;
      const link = el("a");
      link.href = "#" + id;
      link.innerHTML = sf(iconKey) + '<span class="rail-label"></span>';
      link.querySelector(".rail-label").textContent = label;
      link.addEventListener("click", (e) => {
        e.preventDefault();
        if (sec.hidden) return;
        sec.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      });
      railNav.appendChild(link);
      return [link, sec];
    }).filter(Boolean);

    let ticking = false;
    const spy = () => {
      ticking = false;
      // 视口上沿下 24pt 处为判定线:最后一个越过该线的模块即当前模块
      const line = scroller.getBoundingClientRect().top + 24;
      let current = null;
      railLinks.forEach((item) => {
        if (!item[1].hidden && item[1].getBoundingClientRect().top <= line) current = item;
      });
      railLinks.forEach((item) => item[0].classList.toggle("active", item === current));
    };
    scroller.addEventListener("scroll", () => {
      // 阅读进度:时间栏下沿细线随滚动位置增长
      const max = scroller.scrollHeight - scroller.clientHeight;
      navProgress.style.width = (max > 0 ? (scroller.scrollTop / max) * 100 : 0) + "%";
      if (!ticking) { ticking = true; requestAnimationFrame(spy); }
    }, { passive: true });
    window.addEventListener("resize", spy);
    spy();

    // 分区滚动进场
    if ("IntersectionObserver" in window && !reduceMotion) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("shown");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });
      document.querySelectorAll("#content > section").forEach((sec) => {
        sec.classList.add("reveal");
        io.observe(sec);
      });
    }

    // 回到顶部(滚回内层容器顶部)
    const toTop = $("to-top");
    scroller.addEventListener("scroll", () => {
      toTop.classList.toggle("show", scroller.scrollTop > 700);
    }, { passive: true });
    toTop.addEventListener("click", () => {
      scroller.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    });
  } catch (err) {
    console.error("visual enhancements failed:", err);
  }
})();
</script>
</body>
</html>
