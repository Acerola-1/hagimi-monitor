<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HagimiMonitor</title>
<style>
  /*__FLATPICKR_CSS__*/
  /* 符号图标:字形由生成端按 SF Symbols 渲染并内联为 --i-*,这里只负责着色与尺寸。*/
  .sf {
    display: inline-block; vertical-align: -0.14em; flex: none;
    width: 15px; height: 15px; background-color: currentColor;
    -webkit-mask-image: var(--i, none); mask-image: var(--i, none);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  /*__SYMBOL_CSS__*/
  .sf-cpu { --i: var(--i-cpu); }
  .sf-gpu { --i: var(--i-gpu); }
  .sf-mem { --i: var(--i-mem); }
  .sf-net { --i: var(--i-net); }
  .sf-disk { --i: var(--i-disk); }
  .sf-power { --i: var(--i-power); }
  .sf-fan { --i: var(--i-fan); }
  .sf-thermal { --i: var(--i-thermal); }
  .sf-batt { --i: var(--i-batt); }
  .sf-health { --i: var(--i-health); }
  .sf-trend { --i: var(--i-trend); }
  .sf-overview { --i: var(--i-overview); }
  .sf-dist { --i: var(--i-dist); }
  .sf-heatmap { --i: var(--i-heatmap); }
  .sf-battHealth { --i: var(--i-battHealth); }
  .sf-alert { --i: var(--i-alert); }
  .sf-table { --i: var(--i-table); }
  .sf-insights { --i: var(--i-insights); }
  .sf-apps { --i: var(--i-apps); }
  .sf-legacy { --i: var(--i-legacy); }
  .sf-top { --i: var(--i-top); }
  .sf-device { --i: var(--i-device); }
  .sf-os { --i: var(--i-os); }
  .sf-clock { --i: var(--i-clock); }
  .sf-calendar { --i: var(--i-calendar); }
  :root {
    --bg: #0a0b0e;
    --bg-grad-1: rgba(41, 151, 255, 0.07);
    --bg-grad-2: rgba(255, 255, 255, 0.02);
    --bg-grad-3: transparent;
    --card: rgba(20, 23, 29, 0.78);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover: rgba(255, 255, 255, 0.04);
    --card-glow: rgba(255, 255, 255, 0.03);
    --inset: rgba(255, 255, 255, 0.04);
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #86868b;
    --tooltip-bg: rgba(18, 20, 26, 0.96);
    --tooltip-border: rgba(255, 255, 255, 0.12);
    --accent: #2997ff;
    --radius: 12px;
    --nav-bg: rgba(10, 11, 14, 0.82);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.20);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC",
            "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", ui-monospace, "Cascadia Code", "JetBrains Mono", monospace;
    /* 应用图标扁平渲染:报告为单文件产物,图标以 data URI 随模板内嵌 */
    --app-icon: url("data:image/png;base64,__APP_ICON_B64__");
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f7;
      --bg-grad-1: rgba(0, 113, 227, 0.05);
      --bg-grad-2: rgba(0, 0, 0, 0.02);
      --bg-grad-3: transparent;
      --card: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover: #ffffff;
      --card-glow: rgba(0, 0, 0, 0.02);
      --inset: #f5f5f7;
      --text: #1d1d1f;
      --text-2: #515154;
      --text-3: #86868b;
      --tooltip-bg: rgba(255, 255, 255, 0.98);
      --tooltip-border: rgba(0, 0, 0, 0.10);
      --accent: #0071e3;
      --nav-bg: rgba(245, 245, 247, 0.85);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(1200px 500px at 15% -10%, var(--bg-grad-1), transparent 60%),
      radial-gradient(1000px 600px at 90% 0%, var(--bg-grad-2), transparent 55%),
      radial-gradient(800px 400px at 50% 100%, var(--bg-grad-3), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  /* 氛围光斑:两枚低透明度光晕缓慢漂移,为深浅色主题提供空间层次 */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%;
    filter: blur(90px); pointer-events: none;
  }
  body::before {
    width: 560px; height: 560px; left: -160px; top: -180px;
    background: radial-gradient(circle, rgba(122, 162, 247, 0.16), transparent 65%);
    animation: aurora-a 26s ease-in-out infinite alternate;
  }
  body::after {
    width: 640px; height: 640px; right: -220px; top: 260px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.12), transparent 65%);
    animation: aurora-b 34s ease-in-out infinite alternate;
  }
  @keyframes aurora-a { to { transform: translate(130px, 90px) scale(1.18); } }
  @keyframes aurora-b { to { transform: translate(-150px, -70px) scale(0.88); } }
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after { animation: none; }
  }
  /* ── 版式:顶部识读条 + 左侧模块栏 + 右侧(时间栏 + 独立滚动内容) ──
     模块栏与时间栏都常驻在滚动容器之外,不依赖滚动事件或图表渲染才出现;
     内容区独立滚动,长报表在窄窗口里也不会把导航推出视野。 */
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px 24px; flex-wrap: wrap; flex: none;
    padding: 16px 26px 14px; border-bottom: 1px solid var(--card-border);
  }
  .top-side { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .workspace { display: flex; flex: 1; min-height: 0; }
  .rail {
    width: 184px; flex: none; display: flex; flex-direction: column;
    overflow: auto; padding: 20px 12px 18px;
    border-right: 1px solid var(--card-border);
    background: var(--card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .rail .eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--text-3); padding: 0 10px 12px; font-family: var(--font-mono);
  }
  .module-nav { display: flex; flex-direction: column; gap: 3px; }
  .module-nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px; border-radius: 9px; text-decoration: none;
    color: var(--text-2); font-size: 12.5px; font-weight: 600; white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .module-nav a .sf { width: 16px; height: 16px; flex: none; color: var(--text-3); }
  .module-nav a:hover { background: var(--inset); color: var(--text); }
  .module-nav a.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .module-nav a.active .sf { color: var(--accent); }
  .rail-footer {
    margin-top: auto; padding: 26px 10px 0;
    font-size: 10.5px; color: var(--text-3); line-height: 1.7;
  }
  .rail-footer .status-dot {
    display: inline-block; width: 6px; height: 6px; margin-right: 6px;
    border-radius: 50%; background: var(--accent);
  }
  .rail-footer small { display: block; margin-top: 3px; font-size: 10px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .filters {
    position: relative; flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 26px; border-bottom: 1px solid var(--card-border); background: var(--card);
  }
  .filter-title { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); letter-spacing: 0.4px; }
  .range-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .scroll { flex: 1; min-height: 0; overflow: auto; scroll-behavior: smooth; scroll-padding-top: 18px; }
  .content { max-width: 1180px; margin: 0 auto; padding: 24px 26px 56px; }

  /* ── 报告 masthead:苹果原厂硬件规格档案 (Cupertino Specimen) ── */
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background-image: var(--app-icon); background-size: 100% 100%;
    box-shadow: 0 0 0 1px var(--card-border), 0 3px 10px rgba(0, 0, 0, 0.25);
  }
  .brand .kicker {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--accent); margin-bottom: 5px;
    font-family: var(--font-mono);
  }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.6px; color: var(--text); }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-2); font-family: var(--font-mono);
    padding: 5px 11px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--card-border);
    box-shadow: 0 1px 0 var(--card-glow) inset;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .chip .sf { width: 13px; height: 13px; color: var(--text-3); }

  /* ── 范围控件(位于固定导航内) ────────────── */
  .toolbar { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; margin: 0; }
  .ranges { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px;
    background: linear-gradient(180deg, var(--card-glow), transparent), var(--card);
    border: 1px solid var(--card-border); box-shadow: 0 1px 0 var(--card-glow) inset; }
  .ranges button {
    appearance: none; border: 0; background: transparent; color: var(--text-2);
    font: 600 12px/1 var(--font); padding: 7px 12px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .ranges button:hover { color: var(--text); background: var(--inset); }
  .ranges button.active { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 15%, transparent); }
  .custom-range { position: relative; flex: none; }
  /* 自定义日期范围:Flatpickr 日期选择库的字段与日历皮肤,跟随报告暗色令牌体系 */
  .cal-field {
    appearance: none; cursor: pointer; min-width: 132px;
    font: 600 12px/1 var(--font);
    padding: 8px 12px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--card-border);
    color: var(--text-2); color-scheme: inherit;
    box-shadow: 0 1px 0 var(--card-glow) inset;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .cal-field::placeholder { color: var(--text-3); font-weight: 500; }
  .cal-field:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 42%, transparent); }
  .cal-field:focus { outline: none; color: var(--text); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .cal-field.active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 42%, transparent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 15%, transparent); }
  /* Flatpickr 日历面板结构,覆盖其默认浅色皮肤为暗色毛玻璃 */
  .flatpickr-calendar {
    margin-top: 8px; width: auto; padding: 8px;
    background: var(--tooltip-bg); border: 1px solid var(--tooltip-border); border-radius: 14px;
    box-shadow: var(--shadow); color: var(--text-2);
  }
  .flatpickr-calendar.open { z-index: 60; }
  .flatpickr-weekday, .flatpickr-day, .flatpickr-monthDropdown-month, .flatpickr-current-year {
    font-family: var(--font);
  }
  .flatpickr-months .flatpickr-prev-month, .flatpickr-months .flatpickr-next-month,
  .flatpickr-months .flatpickr-month, .flatpickr-current-month input.cur-year,
  .flatpickr-current-month .numInputWrapper {
    color: var(--text);
  }
  .flatpickr-monthDropdown-month, .flatpickr-current-month input.cur-year { color: var(--text); }
  .flatpickr-weekday { color: var(--text-3); font-weight: 600; font-size: 11px; }
  .flatpickr-innerContainer, .flatpickr-days, .dayContainer { background: transparent; }
  .flatpickr-day {
    color: var(--text-2); border: 0; border-radius: 8px; font-size: 12px;
  }
  .flatpickr-day:hover:not(.flatpickr-disabled) { color: var(--text); background: var(--inset); }
  .flatpickr-day.flatpickr-disabled, .flatpickr-day.disabled { color: var(--text-3); opacity: 0.4; }
  .flatpickr-day.flatpickr-disabled:hover { background: transparent; }
  .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
    color: #fff; background: color-mix(in srgb, var(--accent) 85%, #000); border: 0;
    box-shadow: none;
  }
  .flatpickr-day.selected:hover, .flatpickr-day.startRange:hover, .flatpickr-day.endRange:hover {
    color: #fff; background: var(--accent);
  }
  .flatpickr-day.inRange { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--text); }
  .flatpickr-day.startRange { border-radius: 8px 0 0 8px; }
  .flatpickr-day.endRange { border-radius: 0 8px 8px 0; }
  .flatpickr-day.today { box-shadow: inset 0 0 0 1px var(--accent); }
  .flatpickr-prev-month, .flatpickr-next-month { fill: var(--text-3); }
  .flatpickr-prev-month:hover, .flatpickr-next-month:hover { fill: var(--accent); }
  .flatpickr-current-month .numInputWrapper span.arrowUp, .flatpickr-current-month .numInputWrapper span.arrowDown { display: none; }
  .flatpickr-current-month .numInputWrapper input { color: var(--text); font-size: 13px; font-weight: 600; }
  .flatpickr-monthDropdown-months { background: var(--tooltip-bg); color: var(--text); border-radius: 6px; }
  .flatpickr-months .flatpickr-month { padding: 4px 0 8px; }

  /* ── 卡片通用 ──────────────────────────── */
  .card {
    background:
      linear-gradient(180deg, var(--card-glow), transparent 50%),
      var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 18px 20px 14px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  section { margin-bottom: 18px; }
  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
  .sec-head .sf { width: 16px; height: 16px; color: var(--text-3); flex: none; }
  .sec-head h2 { margin: 0; font-size: 13.5px; font-weight: 700; letter-spacing: -0.1px; text-transform: uppercase; }
  .sec-head .hint { margin-left: auto; font-size: 11px; color: var(--text-3); font-family: var(--font-mono); font-weight: 500; }
  .chart { width: 100%; height: 300px; }
  .chart.tall { height: 340px; }
  .chart.short { height: 260px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  section.inner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  @media (max-width: 900px) {
    .grid2, section.inner-grid { grid-template-columns: 1fr; }
  }
  .empty {
    display: none; padding: 34px 20px; text-align: center;
    color: var(--text-3); font-size: 13px;
  }
  .empty .sf { width: 22px; height: 22px; margin-bottom: 8px; opacity: 0.7; }

  /* ── 首屏总览带:健康评分卡 + KPI 网格同行,核心摘要一屏读完 ── */
  .summary { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1020px) { .summary { grid-template-columns: 1fr; } }
  .summary-kpis {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
    gap: 10px; align-content: start;
  }
  .summary-kpis .kpi { padding: 12px 14px 10px; border-radius: var(--radius); }
  .summary-kpis .kpi-chip { width: 26px; height: 26px; border-radius: 6px; }
  .summary-kpis .kpi-chip .sf { width: 13px; height: 13px; }
  .summary-kpis .kpi .value { font-size: 20px; margin-top: 6px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; }
  .summary-kpis .kpi .sub { margin-top: 2px; }
  .summary-kpis .spark { height: 22px; }
  .summary-kpis .spark-wrap { padding-top: 7px; }
  .health-main { display: flex; align-items: center; gap: 20px; padding: 10px 2px 4px; flex-wrap: wrap; }
  .score-ring-wrap { position: relative; width: 108px; height: 108px; flex: none; }
  .score-ring-text {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
  }
  .score-ring-wrap svg circle { transform: rotate(-90deg); transform-origin: center; }
  .score-ring-wrap svg circle.arc { transition: stroke-dashoffset 0.9s cubic-bezier(0.25, 0.9, 0.35, 1); }
  .score-num { font-size: 32px; font-weight: 800; font-family: var(--font-mono); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.5px; }
  .score-level { font-size: 11px; font-weight: 600; margin-top: 5px; letter-spacing: 0.3px; }
  .score-dims { display: flex; flex-wrap: wrap; gap: 6px; max-width: 380px; }
  .score-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 550; color: var(--text-2);
    border: 1px solid var(--card-border);
    background: linear-gradient(180deg, var(--card-glow), transparent), var(--inset);
    padding: 4px 10px; border-radius: 999px;
  }
  .score-badge .dot { width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
  .score-badge .raw { color: var(--text-3); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
  .score-capped {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    font-size: 11.5px; font-weight: 550; color: #e08e45;
  }
  .score-capped .sf { width: 13px; height: 13px; }

  /* ── KPI(直接填充 .summary-kpis 栅格) ─── */
  .kpi {
    background: linear-gradient(180deg, var(--card-glow), transparent 50%), var(--card);
    border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 14px 16px 12px; display: flex; flex-direction: column;
    box-shadow: 0 1px 0 var(--card-glow) inset;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .kpi:hover { background: linear-gradient(180deg, var(--card-glow), transparent 50%), var(--card-hover); transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 20%, var(--card-border)); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .kpi .label { font-size: 11px; color: var(--text-3); font-weight: 650; letter-spacing: 0.4px; }
  .kpi .value { font-weight: 700; margin-top: 9px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
  .kpi .sub { font-size: 11px; color: var(--text-3); margin-top: 3px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
  .spark-wrap { margin-top: auto; padding-top: 10px; display: block; }
  .spark { width: 100%; height: 30px; display: block; overflow: visible; }
  .spark polyline { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .spark .spark-area { fill: currentColor; opacity: 0.13; }
  .c-cpu { color: #2997ff; } .c-gpu { color: #bf5af2; } .c-mem { color: #64d2ff; }
  .c-net { color: #70d7c7; } .c-disk { color: #ffd60a; } .c-batt { color: #30d158; }
  .c-thermal { color: #ff453a; } .c-muted { color: var(--text-3); } .c-accent { color: var(--accent); }
  @media (prefers-color-scheme: light) {
    .c-cpu { color: #0071e3; } .c-gpu { color: #8944ab; } .c-mem { color: #0284c7; }
    .c-net { color: #00c7be; } .c-disk { color: #b45309; } .c-batt { color: #34c759; }
    .c-thermal { color: #ff3b30; }
  }

  /* ── 热力图 ────────────────────────────── */
  .heat-legend { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); }
  .heat-scale { width: 110px; height: 8px; border-radius: 4px; border: 1px solid var(--card-border); }
  .heat-scale.theme-dark { background: linear-gradient(90deg, #1c2534, #274068, #4c7fd0, #f0a34c, #f4643c); }
  .heat-scale.theme-light { background: linear-gradient(90deg, #e8edf4, #c3d4ee, #7fa8e0, #f0a34c, #e2543c); }

  /* ── 应用排行 ──────────────────────────── */
  .apps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  section.apps-section { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  @media (max-width: 900px) { .apps-grid, section.apps-section { grid-template-columns: 1fr; } }
  .app-list { display: flex; flex-direction: column; }
  .app-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--card-border); transition: background 0.12s ease; }
  .app-row:last-child { border-bottom: none; }
  .app-row:hover { background: var(--inset); border-radius: 6px; }
  .app-row img { width: 24px; height: 24px; border-radius: 6px; flex: none; }
  .app-row .app-icon-fallback { width: 24px; height: 24px; border-radius: 6px; flex: none;
    display: grid; place-items: center; background: var(--inset); color: var(--text-3); }
  .app-row .app-icon-fallback .sf { width: 12px; height: 12px; }
  .app-row .app-name { width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-2); }
  .app-row .app-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--inset); overflow: hidden; }
  .app-row .app-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .app-row .app-value { flex: none; min-width: 74px; text-align: right; font-size: 11.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  .app-none { grid-column: 1 / -1; padding: 20px 0 14px; text-align: center; color: var(--text-3); font-size: 12.5px; }

  /* ── 事件时间线 ─────────────────────────── */
  .events { display: flex; flex-direction: column; }
  .event {
    display: flex; align-items: baseline; gap: 12px;
    padding: 9px 2px; border-bottom: 1px solid var(--card-border);
    font-size: 12.5px;
  }
  .event:last-child { border-bottom: none; }
  .event .sev { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; box-shadow: 0 0 6px currentColor; }
  .event .time { color: var(--text-3); font-family: var(--font-mono); font-variant-numeric: tabular-nums; flex: none; width: 128px; font-size: 11.5px; }
  .event .what { color: var(--text); font-weight: 550; }
  .event .detail { color: var(--text-3); margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; font-weight: 500; }
  .event-none { padding: 26px 0; text-align: center; color: var(--text-3); font-size: 13px; }

  /* ── 表格 ──────────────────────────────── */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 9px 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--text-3); font-weight: 600; font-size: 11.5px; letter-spacing: 0.3px;
    border-bottom: 1px solid var(--card-border); }
  tbody tr { border-bottom: 1px solid var(--card-border); transition: background 0.12s ease; }
  tbody tr:hover { background: var(--inset); }
  td { color: var(--text-2); font-family: var(--font-mono); font-weight: 500; }
  td.day { color: var(--text); font-weight: 600; font-family: var(--font); }

  /* ── 洞察 ─────────────────────────────── */
  .insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .insight {
    display: flex; flex-direction: column; gap: 9px;
    background:
      linear-gradient(150deg, color-mix(in srgb, currentColor 10%, transparent), transparent 62%),
      linear-gradient(180deg, var(--card-glow), transparent 50%),
      var(--card);
    border: 1px solid color-mix(in srgb, currentColor 16%, var(--card-border));
    border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 1px 0 var(--card-glow) inset;
    transition: border-color 0.2s ease;
  }
  .insight:hover { border-color: color-mix(in srgb, currentColor 28%, var(--card-border)); }
  .insight-head { display: flex; align-items: center; gap: 7px; }
  .insight-head .sf { width: 14px; height: 14px; flex: none; }
  .insight .t { font-size: 11.5px; color: var(--text-3); font-weight: 600; letter-spacing: 0.3px; }
  .insight .v { font-size: 13.5px; color: var(--text); line-height: 1.5; font-weight: 550; }

  /* ── 空态 / 页脚 ───────────────────────── */
  .blank-hero { text-align: center; padding: 90px 20px; color: var(--text-2); }
  .blank-hero .sf { width: 42px; height: 42px; color: var(--accent); opacity: 0.9; }
  .blank-hero h2 { font-size: 18px; margin: 16px 0 6px; color: var(--text); }
  .blank-hero p { font-size: 13px; color: var(--text-3); line-height: 1.7; max-width: 420px; margin: 0 auto; }
  footer { margin-top: 34px; text-align: center; font-size: 11.5px; color: var(--text-3); line-height: 1.8; }
  .sf { display: inline-block; vertical-align: middle; }
  [hidden] { display: none !important; }

  /* ── 标题渐变 ─────────────────────────── */
  .brand h1 {
    background: linear-gradient(120deg, var(--text) 40%, var(--accent) 95%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }

  /* 时间栏下沿的阅读进度:细线随滚动位置增长 */
  .nav-progress {
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; border-radius: 0 2px 2px 0;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #a855f7));
    width: 0; transition: width 0.1s linear;
  }
  @media (max-width: 980px) {
    .rail { width: 150px; padding-inline: 9px; }
    .module-nav a { gap: 8px; padding: 9px 8px; font-size: 12px; }
    .top, .filters { padding-inline: 18px; }
    .content { padding: 20px 18px 48px; }
  }
  @media (max-width: 720px) {
    .rail { width: 116px; }
    .module-nav a { gap: 7px; padding: 8px 7px; font-size: 11px; }
    .rail-footer { display: none; }
  }

  /* ── 卡片进场动效(滚动触发) ───────────── */
  section, .kpi, .insight { transition: opacity 0.5s ease, transform 0.5s ease; }
  .reveal { opacity: 0; transform: translateY(14px); }
  .reveal.shown { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    section, .kpi, .insight { transition: none; }
    .reveal { opacity: 1; transform: none; }
    html { scroll-behavior: auto; }
  }

  /* ── KPI 图标芯片:外层 span 承载底色,svg 只画图形 ── */
  .kpi-chip {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    background: color-mix(in srgb, currentColor 14%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
    box-shadow: 0 0 12px color-mix(in srgb, currentColor 12%, transparent);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .kpi-chip .sf { width: 17px; height: 17px; margin: 0; }
  .kpi:hover .kpi-chip { transform: scale(1.08); box-shadow: 0 0 18px color-mix(in srgb, currentColor 20%, transparent); }

  /* ── 分区标题图标芯片化 ────────────────── */
  .sec-head .icon-chip {
    display: grid; place-items: center; width: 26px; height: 26px;
    border-radius: 7.5px; flex: none;
    background: color-mix(in srgb, currentColor 12%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .sec-head .icon-chip .sf { width: 14px; height: 14px; margin: 0; color: currentColor; }
  .card:hover .sec-head .icon-chip {
    transform: scale(1.06);
    box-shadow: 0 0 14px color-mix(in srgb, currentColor 22%, transparent);
  }

  /* 粘性导航下的锚点滚动留白 */
  /* 锚点跳转(设置页「查看时段」等)落在内层滚动容器里:时间栏在容器之外,留一点呼吸即可 */
  #content > section { scroll-margin-top: 18px; }

  /* ── 卡片悬浮微交互 ───────────────────── */
  .card { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 18%, var(--card-border)); }

  /* ── 回到顶部 ─────────────────────────── */
  .to-top {
    position: fixed; right: 26px; bottom: 26px; z-index: 50;
    width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--card-border);
    display: grid; place-items: center; cursor: pointer;
    background: var(--nav-bg); color: var(--text-2);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease, color 0.15s ease;
  }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
  .to-top:hover { color: var(--accent); }
  .to-top .sf { width: 18px; height: 18px; }

  /* ── 顶栏「打印 / 导出 PDF」按钮:与时间选择器同处导航右端 ── */

  /* ── 打印 / 导出 PDF:强制浅色纸张排版,移除屏幕专属的氛围层与交互件 ── */
  @media print {
    :root {
      --bg: #ffffff;
      --bg-grad-1: transparent; --bg-grad-2: transparent; --bg-grad-3: transparent;
      --card: #ffffff; --card-border: #e5e5e7; --card-hover: #ffffff;
      --card-glow: transparent; --inset: #f5f5f7;
      --text: #1d1d1f; --text-2: #424245; --text-3: #6e6e73;
      --tooltip-bg: #ffffff; --tooltip-border: #e5e5e7;
      --accent: #2563eb; --nav-bg: #ffffff;
      --shadow: none; --shadow-sm: none;
      color-scheme: light;
    }
    /* 氛围光晕、模块栏、返回顶部、打印按钮均为屏幕交互层,纸上不需要 */
    body::before, body::after,
    .rail, .to-top { display: none !important; }
    /* 内层滚动容器在纸上必须摊平:否则只印出首屏可见的那一段 */
    .shell, .workspace, .main, .scroll {
      display: block !important; height: auto !important; overflow: visible !important;
    }
    /* 时间档位是交互控件,纸上只保留「当前范围」文案 */
    .range-controls { display: none !important; }
    body { background: #ffffff !important; }
    /* 滚动进场的隐藏态必须全部显形,否则未滚到的分区在纸上空白 */
    .reveal { opacity: 1 !important; transform: none !important; }
    /* 去除发光与投影;卡片、图表、指标卡避免跨页截断,表格允许分页但整行不拆 */
    * { box-shadow: none !important; text-shadow: none !important; }
    .card, .kpi, .insight, .chart, .health-main { break-inside: avoid; page-break-inside: avoid; }
    tr, .app-row, .event { break-inside: avoid; page-break-inside: avoid; }
    thead { display: table-header-group; }
    .chart canvas { max-width: 100% !important; height: auto !important; }
    .content { max-width: none; padding: 0; }
    a { color: inherit; text-decoration: none; }
    @page { margin: 14mm; }
  }
  /*__HARDWARE_CSS__*/
</style>
</head>

<script>window.__DATA__ = /*__DATA__*/null;</script>
<script>
"use strict";
(function () {
  const DATA = window.__DATA__;
  const I = DATA.i18n;
  const COLS = DATA.cols;
  const IDX = {};
  COLS.forEach((c, i) => { IDX[c] = i + 1; });
  const NIX = COLS.length + 1;
  // 渠道标识:Direct 版可采集 CPU 温度/风扇 RPM 等 SMC 数据,沙盒版不可。

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  // 符号图标:字形由生成端内联成 CSS 变量(--i-*),这里只用 class 选色/尺寸,
  // 颜色跟随 currentColor(主题与选中态自动适配)。
  const sf = (key, cls) => `<span class="sf sf-${key} ${cls || ""}"></span>`;

  /*__HARDWARE_JS__*/

  // ── 主题调色板(跟随系统明暗,变更时全量重绘) ───────────────────
  const themeQuery = matchMedia("(prefers-color-scheme: light)");
  let C = null;
  // 打印 / 导出 PDF 期间为真:关图表动画与数字滚动,强制浅色重绘。
  let PRINTING = false;
  function makePalette(isLight) {
    if (isLight) {
      return {
        cpu: "#0071e3", gpu: "#8944ab", mem: "#0284c7", net: "#00c7be",
        netUp: "#5856d6", disk: "#b45309", diskW: "#d97706", batt: "#34c759",
        thermal: "#ff3b30", battTemp: "#ff9500", fan: "#8e8e93", accent: "#0071e3",
        good: "#34c759", scoreGood: "#0071e3", fair: "#ff9500", poor: "#ff9500", critical: "#ff3b30",
        grid: "rgba(0,0,0,0.05)", axis: "rgba(0,0,0,0.16)",
        label: "rgba(0,0,0,0.55)", ring: "rgba(0,0,0,0.08)",
        tooltipBg: "rgba(255,255,255,0.98)", tooltipBorder: "rgba(0,0,0,0.10)", tooltipText: "#1d1d1f",
        heat: ["#e8edf4", "#c3d4ee", "#7fa8e0", "#f0a34c", "#e2543c"],
        heatBorder: "rgba(242,244,248,0.9)", pieBorder: "rgba(242,244,248,0.95)",
      };
    }
    return {
      cpu: "#2997ff", gpu: "#bf5af2", mem: "#64d2ff", net: "#70d7c7",
      netUp: "#7d7aff", disk: "#ffd60a", diskW: "#ff9f0a", batt: "#30d158",
      thermal: "#ff453a", battTemp: "#ff9f0a", fan: "#98989d", accent: "#2997ff",
      good: "#30d158", scoreGood: "#2997ff", fair: "#ffd60a", poor: "#ff9f0a", critical: "#ff453a",
      grid: "rgba(255,255,255,0.05)", axis: "rgba(255,255,255,0.12)",
      label: "rgba(255,255,255,0.50)", ring: "rgba(255,255,255,0.08)",
      tooltipBg: "rgba(18,20,26,0.96)", tooltipBorder: "rgba(255,255,255,0.12)", tooltipText: "#f5f5f7",
      heat: ["#151922", "#203452", "#3a6bb5", "#d9822b", "#e05328"],
      heatBorder: "rgba(10,11,14,0.85)", pieBorder: "rgba(10,11,14,0.9)",

  }
  function applyTheme() {

    $("heat-scale").className = "heat-scale " + (themeQuery.matches ? "theme-light" : "theme-dark");
  }
  applyTheme();
  if (themeQuery.addEventListener) {
    themeQuery.addEventListener("change", () => {
      // applyRange 会重渲含热力图在内的全部板块,无需在此单独渲热力图
      applyTheme();
      applyRange();
    });
  }

  // 打印 / 导出 PDF 期间强制浅色图表:系统深色下画布轴标签为浅色,印到白纸上不可见,
  // 打印前切浅色调色板重绘并同步刷新画布,打印后还原系统主题配色。
  function enterPrintMode() {
    if (PRINTING) return;
    PRINTING = true;
    if (!themeQuery.matches) {
      C = makePalette(true);
      $("heat-scale").className = "heat-scale theme-light";
      applyRange();
      Object.values(charts).forEach((c) => { try { c.getZr().refreshImmediately(); } catch (e) {} });
    }
  }
  function exitPrintMode() {
    if (!PRINTING) return;
    PRINTING = false;
    if (!themeQuery.matches) {
      applyTheme();
      applyRange();
    }
  }

  const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font");

  function fmtBytes(b) {
    if (b == null || isNaN(b)) return "—";
    const u = ["B", "KB", "MB", "GB", "TB", "PB"];
    let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i === 0 ? b.toFixed(0) : b.toFixed(1)) + " " + u[i];
  }
  function fmtRate(bps) { return bps == null ? "—" : fmtBytes(bps) + "/s"; }
  function fmtPct(v, d) { return v == null ? "—" : v.toFixed(d == null ? 1 : d) + "%"; }
  function fmtW(w) { return w == null ? "—" : w.toFixed(1) + " W"; }
  function fmtRPM(v) { return v == null ? "—" : Math.round(v).toLocaleString() + " RPM"; }
  function fmtClock(ms) {
    const d = new Date(ms);
    const two = (n) => String(n).padStart(2, "0");
    return two(d.getHours()) + ":" + two(d.getMinutes());
  }
  function fmtDate(ms) {
    const d = new Date(ms);
    return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
  }
  function fmtDateShort(ms) {
    const d = new Date(ms);
    return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
  }
  function fmtHours(seconds) {
    if (seconds == null) return "—";
    return (seconds / 3600).toFixed(1) + " h";
  }
  function fmtSpan(seconds) {
    if (seconds == null) return "—";
    // 分钟粒度事件最短 120s(2 桶),明确给分/时/天三级而非 .toFixed 截断,避免短时事件显示 "0.0 h"
    if (seconds < 60) return "<1 min";
    if (seconds < 3600) return Math.round(seconds / 60) + " min";
    if (seconds < 48 * 3600) return (seconds / 3600).toFixed(1) + " h";
    return (seconds / 86400).toFixed(1) + " d";
  }
  // 数值滚动:解析前导数字 + 保留后缀与精度,~650ms 缓动到位;非数值原样展示
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countUp(node, text) {
    const m = /^(-?[\d.]+)(.*)$/.exec(text);
    const target = m ? parseFloat(m[1]) : NaN;
    if (!m || isNaN(target)) { node.textContent = text; return; }
    if (reduceMotion || PRINTING) { node.textContent = text; return; }
    const suffix = m[2];
    const decimals = (m[1].split(".")[1] || "").length;
    const dur = 650;
    const start = performance.now();
    function frame(nowTs) {
      const p = Math.min(1, (nowTs - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      node.textContent = (target * eased).toFixed(decimals) + suffix;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function t(key, kv) {
    let s = I[key] || key;
    if (kv) for (const k in kv) s = s.replaceAll("{" + k + "}", kv[k]);
    return s;
  }

  const DAY = 86400 * 1000;
  // 生成时间为秒或毫秒自适应(历史产物两口径都有)
  const generatedMs = DATA.generatedAt < 1e12 ? DATA.generatedAt * 1000 : DATA.generatedAt;
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  // ── 文案与静态骨架 ────────────────────────────────────────────
  document.title = I.reportTitle;
  $("report-title").textContent = I.reportTitle;
  const chips = [
    ["device", DATA.meta.device],
    ["cpu", DATA.meta.model],
    ["os", DATA.meta.os],
    ["clock", t("metaDays", { v: DATA.meta.days })],
    ["calendar", t("metaGenerated", { v: fmtDate(generatedMs) + " " + fmtClock(generatedMs) })],
  ];
  chips.forEach(([ic, text]) => {
    const c = el("span", "chip");
    c.innerHTML = sf(ic) + "<span></span>";
    c.lastChild.textContent = text;
    $("meta-chips").appendChild(c);
  });

  $("t-health").textContent = I.healthTitle;
  $("t-health-trend").textContent = I.healthTrend;
  $("t-overview").textContent = I.secOverview;
  $("t-heatmap").textContent = I.secHeatmap;
  $("t-cpu").textContent = I.secCpu;
  $("t-cpu-pe").textContent = I.secCpuPE;
  $("t-cpu-dist").textContent = I.secCpuDist;
  $("t-gpu").textContent = I.secGpu;
  $("t-gpu-dist").textContent = I.secGpuDist;
  $("t-gpu-mem").textContent = I.secGpuMem;
  $("t-mem").textContent = I.secMem;
  $("t-net").textContent = I.secNet;
  $("t-net-daily").textContent = I.secNetDaily;
  $("t-disk").textContent = I.secDisk;
  $("t-disk-daily").textContent = I.secDiskDaily;
  $("t-power").textContent = I.secPower;
  $("t-batt").textContent = I.secBatt;
  $("t-thermal").textContent = I.secThermal;
  $("t-battery-health").textContent = I.secBatteryHealth;
  $("t-apps-cpu").textContent = I.appsCpu;
  $("t-apps-mem").textContent = I.appsMem;
  $("t-apps-gpu").textContent = I.appsGpu;
  $("t-apps-net").textContent = I.appsNet;
  $("t-events").textContent = I.secEvents;
  $("t-table").textContent = I.secTable;
  $("t-insights").textContent = I.secInsights;
  $("lbl-low").textContent = I.heatLow;
  $("lbl-high").textContent = I.heatHigh;
  // 日期范围字段的占位文案(选择后实时写入所选范围)
  $("cal-range").placeholder = I.selectRange;
  $("footer").innerHTML = I.footer + "<br>" + I.footerLocal;
  // 打印由宿主窗口(WebKit 自带打印按钮)发起:打印前后切换图表配色
  window.addEventListener("beforeprint", enterPrintMode);
  window.addEventListener("afterprint", exitPrintMode);
  ["overview", "cpu", "cpu-pe", "cpu-dist", "gpu", "gpu-dist", "gpu-mem", "mem",
   "net", "net-daily", "disk", "disk-daily", "power", "batt",
   "thermal", "table", "health-trend"].forEach((k) => {
    const e = $("e-" + k);
    if (e) e.innerHTML = sf("dist") + "<div>" + I.emptySection + "</div>";
  });
  const eBatteryHealth = $("e-battery-health");
  if (eBatteryHealth) eBatteryHealth.innerHTML = sf("dist") + "<div>" + I.emptySection + "</div>";

  // ── 数据访问 ──────────────────────────────────────────────────
  const v = (row, col) => row[IDX[col]];
  const frames = (row) => row[NIX];
  // 采样覆盖秒数(真实墙钟口径);迁移前的旧行无此列,回退帧数近似
  const coverSeconds = (row) => v(row, "cover_s") ?? frames(row);
  const timeOf = (row) => row[0] * 1000;

  function rowsBetween(rows, from, to) {
    return rows.filter((r) => r[0] * 1000 >= from && r[0] * 1000 < to);
  }
  function hasAny(rows, col) {
    return rows.some((r) => v(r, col) != null);
  }
  function avgOf(rows, col) {
    let sum = 0, n = 0;
    rows.forEach((r) => {
      const x = v(r, col);
      if (x != null) { sum += x * frames(r); n += frames(r); }
    });
    return n > 0 ? sum / n : null;
  }
  function maxOf(rows, col) {
    let m = null;
    rows.forEach((r) => {
      const x = v(r, col);
      if (x != null && (m == null || x > m)) m = x;
    });
    return m;
  }
  function sumOf(rows, col) {
    let sum = 0, seen = false;
    rows.forEach((r) => {
      const x = v(r, col);
      if (x != null) { sum += x; seen = true; }
    });
    return seen ? sum : null;
  }
  const bucketSeconds = { minutes: 60, hours: 3600, days: 86400 };

  // ── 状态评分(与 App 端 StatisticsHealthScore 同口径) ──────────
  // 只在内存与热状态「同时有效」的交集 J 上算两项负担:负担 = Σ(档位权重 ×
  // 档位秒数) ÷ J,再按 memWeight/thermalWeight 线性重组。CPU/GPU 使用率是工作
  // 强度,不参与扣分;缺观测不生成满分。权重/门槛/等级区间随载荷下发
  // (DATA.scoreModel),与 App 侧同一组数字。
  // 旧口径(帧级应力)只在整段都没有档位秒数列时使用,并在卡上标明近似。
  const THERMAL_SOFT_CAP = 0.01;
  function stressCPU(u) { return u <= 85 ? 0 : Math.min(1, (u - 85) / 15); }
  function stressGPU(u) { return u <= 90 ? 0 : Math.min(1, (u - 90) / 10); }
  function stressMem(percent, level) {
    let s = level === 2 ? 1.0 : level === 1 ? 0.6 : 0;
    if (percent != null && percent > 60) s = Math.max(s, Math.min(0.55, (percent - 60) / 40 * 0.55));
    return s;
  }
  function stressThermal(state, temp) {
    if (state != null) {
      if (state < 0.5) return 0;
      if (state < 1.5) return 0.2;
      if (state < 2.5) return 0.6;
      return 1.0;
    }
    if (temp == null) return 0;
    return temp <= 85 ? 0 : Math.min(1, (temp - 85) / 15);
  }
  function rowStress(r) {
    return {
      mem: v(r, "stress_mem_avg") != null ? v(r, "stress_mem_avg")
        : (v(r, "mem_pressure_avg") != null ? stressMem(v(r, "mem_pressure_avg"), null) : null),
      thermal: v(r, "stress_thermal_avg") != null ? v(r, "stress_thermal_avg")
        : ((v(r, "cpu_thermal_avg") != null || v(r, "cpu_temp_avg") != null)
          ? stressThermal(v(r, "cpu_thermal_avg"), v(r, "cpu_temp_avg")) : null),
      cpu: v(r, "stress_cpu_avg") != null ? v(r, "stress_cpu_avg")
        : (v(r, "cpu_avg") != null ? stressCPU(v(r, "cpu_avg")) : null),
      gpu: v(r, "stress_gpu_avg") != null ? v(r, "stress_gpu_avg")
        : (v(r, "gpu_avg") != null ? stressGPU(v(r, "gpu_avg")) : null),
    };
  }
  // TODO(迁移期):秒数时代(2026-09)之前落库的行没有档位秒数,整段落在那个时期
  // 的老范围要靠下面这组旧口径回退。等历史行滚出可选范围(秒数时代满一年)后,
  // legacyHealthOf / rowStress / 四条应力曲线可整体删除。
  /// 旧口径(升级前历史,或整段都没有档位秒数列):帧级应力按帧数加权平均。
  function legacyHealthOf(rows) {
    const sums = { mem: 0, thermal: 0, cpu: 0, gpu: 0 };
    const ws = { mem: 0, thermal: 0, cpu: 0, gpu: 0 };
    rows.forEach((r) => {
      const n = frames(r);
      if (n <= 0) return;
      const s = rowStress(r);
      for (const k in sums) if (s[k] != null) { sums[k] += s[k] * n; ws[k] += n; }
    });
    const avg = (k) => (ws[k] > 0 ? sums[k] / ws[k] : null);
    const m = avg("mem"), t = avg("thermal"), c = avg("cpu"), g = avg("gpu");
    if (m == null && t == null && c == null && g == null) return null;
    // 缺维度不扣分也不归一:没观测到不健康信号即不罚。
    const stress = (m || 0) * 0.45 + (t || 0) * 0.30 + (c || 0) * 0.15 + (g || 0) * 0.10;
    const score = clamp100(100 * (1 - stress));
    // 等级仍走新口径的区间:同一套等级名,避免旧段落到另一套标签
    return { score, level: scoreLevel(score), m, t, c, g, legacy: true };
  }

  function clamp100(x) { return Math.max(0, Math.min(100, x)); }

  /// 新口径:交集 J 上的内存/热两维负担(0~1)与线性重组后的分数。
  /// 不做门槛判定,单桶复算(评分走势)与范围汇总共用同一函数。
  function scoreShares(rows) {
    const M = DATA.scoreModel;
    const intersection = sumOf(rows, "valid_mem_thermal_s");
    if (!(intersection > 0)) return null;
    const burden = (seconds, weights) => {
      let total = 0;
      seconds.forEach((s, i) => { total += (s || 0) * (weights[i] || 0); });
      return total / intersection;
    };
    const mem = burden(
      [sumOf(rows, "mem_normal_s"), sumOf(rows, "mem_warn_s"), sumOf(rows, "mem_crit_s")],
      M.memoryLevelWeights);
    const thermal = burden(
      [sumOf(rows, "th_nominal_s"), sumOf(rows, "th_fair_s"), sumOf(rows, "th_serious_s"), sumOf(rows, "th_crit_s")],
      M.thermalLevelWeights);
    const stress = mem * M.memWeight + thermal * M.thermalWeight;
    return { mem, thermal, score: clamp100(100 * (1 - stress)) };
  }

  /// 范围评分:新口径 + 门槛;整段都没有档位秒数列时退回旧口径并标记 legacy;
  /// 交集不足门槛、或不足应覆盖时长的比例时不出分数。
  /// 覆盖率的分母从「首个带档位秒数的桶」算起:升级前的旧桶既没有有效观测也
  /// 无法回填(秒数列为 0/空),把它们算进分母会让迁移期内永远不达标;数据
  /// 齐备后(不存在旧桶)与「交集 ≥ 覆盖时长 × ratio」完全等价。
  function healthOf(rows) {
    const M = DATA.scoreModel;
    const intersection = sumOf(rows, "valid_mem_thermal_s");
    if (!(intersection > 0)) return legacyHealthOf(rows);
    if (intersection < M.minIntersectionSeconds) return { insufficient: true, intersection };
    // TODO(迁移期):下面这段只在「范围里既有旧行又有新行」时需要。历史行滚出可选
    // 范围后 modernStart 恒为 0,可与 legacyRows 提示一并删除。
    const modernStart = rows.findIndex(
      (r) => (v(r, "valid_mem_s") || 0) > 0 || (v(r, "valid_thermal_s") || 0) > 0);
    const modern = modernStart > 0 ? rows.slice(modernStart) : rows;
    // 首个现代桶跨在迁移边界上:它的 cover_s 含秒数时代之前的时间,按该桶实测的
    // 交集有效秒数计入(与 J 同源),否则迁移当天永远差几个百分点、评分卡一直
    // 显示观测不足。交集为 0 的边界桶计 0,方向上是保守的(只会更容易出分)。
    const boundary = modernStart > 0 ? (v(modern[0], "valid_mem_thermal_s") || 0) : null;
    const covered = (boundary == null ? 0 : Math.min(sumOf([modern[0]], "cover_s"), boundary))
      + sumOf(modern.slice(1), "cover_s");
    if (covered > 0 && intersection < covered * M.minCoverageRatio) {
      return { insufficient: true, intersection, covered };
    }
    const shares = scoreShares(rows);
    if (!shares) return null;
    return Object.assign(shares, {
      level: scoreLevel(shares.score),
      intersection,
      covered,
      legacyRows: modernStart > 0,
    });
  }

  /// 分数 → 等级(区间随载荷下发,与 App 端 Level(score:) 同源)。
  function scoreLevel(score) {
    const M = DATA.scoreModel;
    if (score >= M.lowThreshold) return "low";
    if (score >= M.mildThreshold) return "mild";
    if (score >= M.elevatedThreshold) return "elevated";
    return "high";
  }

  /// 维度负担 → 等级:负担即该维度单独扣掉的比例,与总分同一组区间,不再另设一套。
  function levelForShare(share) { return scoreLevel(clamp100(100 * (1 - share))); }

  function shareText(s) {
    const p = s * 100;
    return p < 0.05 ? "0%" : p.toFixed(1) + "%";
  }
  const LEVEL_META = {
    low: { color: () => C.good, label: () => I.levelLow },
    mild: { color: () => C.scoreGood, label: () => I.levelMild },
    elevated: { color: () => C.fair, label: () => I.levelElevated },
    high: { color: () => C.critical, label: () => I.levelHigh },
  };

  function renderHealth(rows) {
    const host = $("health-main");
    const h = healthOf(rows);
    if (!h || h.insufficient) {
      // 观测不足:说清「看了多久」而不是给一个没有依据的分数
      const hint = h && h.insufficient
        ? I.healthInsufficient + "(" + fmtSpan(h.intersection) + ")"
        : I.healthNoData;
      host.innerHTML = '<div class="event-none">' + hint + "</div>";
      setChart("ch-health-trend", {}, rows, "cpu_avg");
      return;
    }
    const color = LEVEL_META[h.level].color();

    // 评分只由内存压力与热压力两项构成;旧记录退回的帧级口径是四维,一并展示
    // (数值含义:该维度单独扣掉的比例)。
    const dims = h.legacy
      ? [
          h.m != null && { name: I.dimPressure, raw: shareText(h.m), share: h.m },
          h.t != null && { name: I.dimThermal, raw: shareText(h.t), share: h.t },
          h.c != null && { name: I.dimCpu, raw: shareText(h.c), share: h.c },
          h.g != null && { name: I.dimGpu, raw: shareText(h.g), share: h.g },
        ].filter(Boolean)
      : [
          { name: I.dimPressure, raw: shareText(h.mem), share: h.mem },
          { name: I.dimThermal, raw: shareText(h.thermal), share: h.thermal },
        ];

    const circ = 2 * Math.PI * 44;
    const offset = circ * (1 - Math.min(h.score, 100) / 100);
    let badges = "";
    dims.forEach((d) => {
      const dc = LEVEL_META[levelForShare(d.share)].color();
      badges += '<span class="score-badge"><span class="dot" style="background:' + dc + '"></span>'
        + d.name + '<span class="raw">' + d.raw + "</span></span>";
    });
    // 附注:旧记录标近似;新口径下给「有效观测 + 工作强度(不计分)」
    const notes = [];
    if (h.legacy) {
      notes.push('<div class="score-capped">' + sf("legacy") + I.healthLegacy + "</div>");
    } else {
      const workload = [["cpu_high_s", I.kCpu], ["gpu_high_s", I.kGpu]]
        .map(([col, label]) => {
          const seconds = sumOf(rows, col);
          return seconds > 0 ? label + " " + fmtSpan(seconds) : null;
        })
        .filter(Boolean);
      if (workload.length) {
        notes.push('<div class="score-capped">' + sf("cpu") + I.healthWorkload
          + " " + workload.join(" · ") + "</div>");
      }
      if (h.legacyRows) {
        notes.push('<div class="score-capped">' + sf("dist") + I.healthLegacyRows + "</div>");
      }
    }
    const cappedBadge = notes.join("");
    host.innerHTML =
      '<div class="score-ring-wrap">' +
        '<svg viewBox="0 0 104 104">' +
          '<circle cx="52" cy="52" r="44" fill="none" stroke="' + C.ring + '" stroke-width="8"/>' +
          '<circle cx="52" cy="52" r="44" fill="none" stroke="' + color + '" stroke-width="8" stroke-linecap="round" ' +
            'stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" ' +
            'style="transform:rotate(-90deg);transform-origin:center"/>' +
        "</svg>" +
        '<div class="score-ring-text"><span class="score-num" style="color:' + color + '">' + Math.round(h.score) + '</span>' +
        '<span class="score-level" style="color:' + color + '">' + LEVEL_META[h.level].label() + "</span></div>" +
      "</div>" +
      '<div><div class="score-dims">' + badges + "</div>" + cappedBadge + "</div>";

    // 评分走势:按当前粒度逐桶复算。单桶不走总门槛(否则每桶都「观测不足」),
    // 有新秒数列用新口径,旧记录用帧级近似。
    const trend = [];
    rows.forEach((r) => {
      const rh = scoreShares([r]) || legacyHealthOf([r]);
      if (rh) trend.push([timeOf(r), clamp100(rh.score)]);
    });
    const option = {
      backgroundColor: "transparent",
      textStyle: { fontFamily: FONT },
      color: [C.accent],
      tooltip: Object.assign({}, liveTooltip(), {
        valueFormatter: (val) => val == null ? "—" : val.toFixed(0),
      }),
      legend: { show: false },
      grid: timeGrid(),
      xAxis: baseAxis({ type: "time" }),
      yAxis: baseAxis({ type: "value", min: 0, max: 100,
        axisLabel: { formatter: "{value}", color: C.label, fontSize: 11 } }),
      dataZoom: [{ type: "inside" }],
      series: [Object.assign(lineSeries(I.healthTitle, trend, C.accent),
        { smooth: 0.35, areaStyle: { color: areaGrad(C.accent, 0.22) } })],
    };
    setChart("ch-health-trend", option, rows, "cpu_avg");
  }

  // ── 应用排行 / 电池健康 / 每日电源构成 / 活跃与打卡 ──────────
  function dayKeyOf(ms) {
    const d = new Date(ms);
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }

  function renderApps(from, to) {
    const apps = DATA.apps;
    const section = $("sec-apps");
    if (!apps || !apps.rows || !apps.rows.length) { section.hidden = true; return; }
    section.hidden = false;
    const fromKey = dayKeyOf(from), toKey = dayKeyOf(to);
    const agg = {};
    apps.rows.forEach((r) => {
      const day = r[0], idx = r[1];
      if (day < fromKey || day > toKey) return;
      const a = agg[idx] || (agg[idx] = { cpu: 0, cn: 0, gpu: 0, gn: 0, mem: 0, mn: 0, net: 0 });
      a.cpu += r[2] * r[3]; a.cn += r[3];
      a.gpu += r[4] * r[5]; a.gn += r[5];
      a.mem += r[6] * r[7]; a.mn += r[7];
      a.net += r[8] + r[9];
    });
    function entries(field, countField) {
      return Object.keys(agg)
        .map((idx) => ({ idx: Number(idx), v: countField ? agg[idx][field] / (agg[idx][countField] || 1) : agg[idx][field] }))
        .filter((e) => e.v > 0.05)
        .sort((a, b) => b.v - a.v)
        .slice(0, 8);
    }
    const lists = [
      ["app-list-cpu", entries("cpu", "cn"), C.cpu, (x) => x.toFixed(1) + "%"],
      ["app-list-mem", entries("mem", "mn"), C.mem, (x) => fmtBytes(x * 1_048_576)],
      ["app-list-gpu", entries("gpu", "gn"), C.gpu, (x) => x.toFixed(1) + "%"],
      // 网络/磁盘进程排行仅在 Direct 版采集(沙盒无 nettop/磁盘 IO 权限)
      IS_DIRECT ? ["app-list-net", entries("net", null), C.net, (x) => fmtBytes(x * 1_048_576)] : null,
    ].filter(Boolean);
    // 沙盒版隐藏网络排行的卡片容器
    if (!IS_DIRECT) {
      const netCard = $("app-list-net");
      if (netCard) netCard.parentElement.style.display = "none";
    }
    let any = false;
    lists.forEach(([listId, list, color, format]) => {
      const host = $(listId);
      host.innerHTML = "";
      if (!list.length) {
        host.innerHTML = '<div class="event-none" style="padding:18px 0">' + I.appsNone + "</div>";
        return;
      }
      any = true;
      const max = list[0].v || 1;
      list.forEach((entry) => {
        const row = el("div", "app-row");
        const iconData = apps.icons[entry.idx];
        const iconHTML = iconData
          ? '<img src="data:image/png;base64,' + iconData + '" alt="">'
          : '<span class="app-icon-fallback">' + sf("apps") + "</span>";
        row.innerHTML = iconHTML +
          '<span class="app-name"></span>' +
          '<span class="app-bar"><span class="app-bar-fill" style="width:' +
          Math.max(3, entry.v / max * 100).toFixed(1) + "%;background:linear-gradient(90deg," +
          color + "," + rgba(color, 0.45) + ')"></span></span>' +
          '<span class="app-value"></span>';
        row.querySelector(".app-name").textContent = apps.names[entry.idx] || "?";
        row.querySelector(".app-value").textContent = format(entry.v);
        host.appendChild(row);
      });
    });
    $("apps-none").hidden = any;
  }

  function renderBatteryHealth(from, to) {

  function dayKeyToMs(key) {
    return new Date(Math.floor(key / 10000), Math.floor(key % 10000 / 100) - 1, key % 100).getTime();
  }
  function fmtDayKeyShort(key) {
    return String(Math.floor(key % 10000 / 100)).padStart(2, "0") + "/" + String(key % 100).padStart(2, "0");
  }

  // ── 事件时间线(从统计数据即时推导,可回溯任意范围) ─────────────
  // ── 压力告警(与设置页告警块同一口径) ────────────────────────
  // 只看两类:内存(警告及以上)与热状态(严重及以上);秒数在桶内累计,相邻桶
  // 连成一段。段的状态按「其后是否还有观测」与观测新鲜度判定,不把观测中断
  // 说成已恢复;每段给出档位组成与累计时长。升级前的旧桶没有档位秒数,不参与。
  const ALERT_KINDS = [
    {
      titleKey: "alertMem", icon: "mem", threshold: 1,
      columns: [[2, "mem_crit_s"], [1, "mem_warn_s"]],
      levelKeys: { 2: "memCritical", 1: "memWarning" },
    },
    {
      titleKey: "alertThermal", icon: "thermal", threshold: 2,
      columns: [[3, "th_crit_s"], [2, "th_serious_s"], [1, "th_fair_s"]],
      levelKeys: { 3: "thermalCritical", 2: "thermalSerious", 1: "thermalFair" },
    },
  ];

  function deriveAlerts(rows, source) {
    if (!rows.length) return [];
    const spanMs = bucketSeconds[source] * 1000;
    const freshWindowMs = 5 * 60 * 1000;
    // 有观测的桶:用来判断某段之后还有没有观测(中断 ≠ 恢复)
    const observedEnds = rows
      .filter((r) => (v(r, "valid_mem_s") || 0) > 0 || (v(r, "valid_thermal_s") || 0) > 0)
      .map((r) => timeOf(r) + spanMs);
    const lastObservedEnd = observedEnds.length ? Math.max(...observedEnds) : null;
    const alerts = [];

    ALERT_KINDS.forEach((spec) => {
      const levelsOf = (r) => spec.columns
        .map(([level, col]) => ({ level, seconds: v(r, col) || 0 }))
        .filter((item) => item.seconds > 0);
      const run = { current: null };
      const flush = () => {
        if (run.current && run.current.pressureSeconds > 0) alerts.push(run.current);
        run.current = null;
      };
      rows.forEach((r) => {
        const levels = levelsOf(r);
        const pressure = levels
          .filter((item) => item.level >= spec.threshold)
          .reduce((sum, item) => sum + item.seconds, 0);
        if (pressure <= 0) {
          flush();
          return;
        }
        // 相邻桶(间隔不超过一个桶宽)合并为一段,缺口断开
        if (run.current && timeOf(r) - run.current.end > spanMs * 1.5) flush();
        if (!run.current) {
          run.current = {
            spec, start: timeOf(r), end: timeOf(r) + spanMs,
            pressureSeconds: 0, levels: new Map(),
          };
        }
        run.current.end = timeOf(r) + spanMs;
        run.current.pressureSeconds += pressure;
        levels.forEach((item) => {
          run.current.levels.set(item.level, (run.current.levels.get(item.level) || 0) + item.seconds);
        });
      });
      flush();
    });

    alerts.forEach((alert) => {
      if (lastObservedEnd == null || alert.end < lastObservedEnd) {
        alert.state = "recovered";
      } else {
        alert.state = Date.now() - lastObservedEnd <= freshWindowMs ? "ongoing" : "interrupted";
      }
      alert.worstLevel = Math.max(...alert.levels.keys());
      alert.spanSeconds = (alert.end - alert.start) / 1000;
    });
    // 进行中最优先,其次观测中断,再按累计时长倒序
    const stateRank = { ongoing: 0, interrupted: 1, recovered: 2 };
    return alerts.sort((a, b) => (stateRank[a.state] - stateRank[b.state]) || (b.pressureSeconds - a.pressureSeconds));
  }

  function renderEvents(rows, source) {
    const host = $("events");
    host.innerHTML = "";
    const alerts = deriveAlerts(rows, source);
    $("h-events").textContent = alerts.length ? t("evHint", { n: String(alerts.length) }) : "";
    if (!alerts.length) {
      host.innerHTML = '<div class="event-none">' + I.alertNone + "</div>";
      return;
    }
    const stateText = { ongoing: I.alertOngoing, interrupted: I.alertInterrupted, recovered: I.alertRecovered };
    // 档位配色与设置页一致:严重/临界红,警告/轻微琥珀
    const levelColor = (level) => (level >= 2 ? C.critical : C.fair);
    alerts.forEach((alert) => {
      const d = el("div", "event");
      d.innerHTML = '<span class="sev"></span>'
        + '<span class="time"></span><span class="what"></span><span class="detail"></span>';
      d.querySelector(".time").textContent =
        fmtDate(alert.start) + " " + fmtClock(alert.start) + " – " + fmtClock(alert.end);
      d.querySelector(".what").textContent =
        I[alert.spec.titleKey] + " · " + I[alert.spec.levelKeys[alert.worstLevel]];
      // 档位组成(从高到低),较低档用「含 X」列出,与设置页告警块同一读法
      const parts = [...alert.levels.entries()]
        .sort((a, b) => b[0] - a[0])
        .map(([level, seconds], index) => {
          const name = I[alert.spec.levelKeys[level]];
          return (index === 0 ? "" : I.alertIncludes + " ") + name + " " + fmtSpan(seconds);
        });
      const context = { dur: fmtSpan(alert.pressureSeconds), state: stateText[alert.state] };
      d.querySelector(".detail").textContent = parts.length > 1
        ? t("alertDetail", Object.assign({ levels: parts.join(" · ") }, context))
        : t("alertDetailPlain", context);
      const dot = d.querySelector(".sev");
      dot.style.background = levelColor(alert.worstLevel);
      dot.style.opacity = alert.state === "recovered" ? "0.45" : "1";
      host.appendChild(d);
    });
  }

  // ── 范围与粒度 ────────────────────────────────────────────────
  // 时间档位:今日 / 近 7 天 / 近 30 天 / 近一年(自选日期另走日期控件)。
  // 跨度决定取哪一层数据(见 pickSource):今日走分钟,周/月/年走小时或日。
  const RANGES = [
    ["today", I.rToday, () => [startOfToday, Date.now()]],
    ["week", I.rWeek, () => [Date.now() - 7 * DAY, Date.now()]],
    ["month", I.rMonth, () => [Date.now() - 30 * DAY, Date.now()]],
    ["year", I.rYear, () => [Date.now() - 365 * DAY, Date.now()]],
  ];
  let currentRange = "today";
  let custom = null;

  RANGES.forEach(([key, label]) => {
    const b = el("button");
    b.textContent = label;
    b.dataset.key = key;
    b.onclick = () => { custom = null; currentRange = key; applyRange(); };
    $("ranges").appendChild(b);
  });

  // 日期范围:Flatpickr range 模式,选好首尾两天即即时应用并收起。
  // 星期名取报表语言的 I.wd*,月份名用 Intl 按浏览器语言生成——报表语言取自
  // 系统语言,与浏览器语言在绝大多数情形一致,故月份名同步三语可用。
  const fmtMonth = (o) => new Intl.DateTimeFormat(navigator.language, o);
  const monthLong = [...Array(12)].map((_, i) => fmtMonth({ month: "long" }).format(new Date(2000, i, 1)));
  const monthShort = [...Array(12)].map((_, i) => fmtMonth({ month: "short" }).format(new Date(2000, i, 1)));
  const weekdayShort = [I.wd0, I.wd1, I.wd2, I.wd3, I.wd4, I.wd5, I.wd6];
  const calPicker = flatpickr("#cal-range", {
    mode: "range",
    dateFormat: "Y-m-d",
    maxDate: "today",
    showMonths: 1,
    locale: {
      firstDayOfWeek: 1,
      rangeSeparator: " – ",
      months: { shorthand: monthShort, longhand: monthLong },
      weekdays: { shorthand: weekdayShort, longhand: weekdayShort },
    },
    onOpen: () => $("cal-range").classList.add("active"),
    onClose: () => {
      $("cal-range").classList.remove("active");
      // 半选/取消(起点无终点或清空)比保留上一自定义范围干净;选中完整两天才应用
      if (calPicker.selectedDates.length !== 2) {
        if (calPicker.selectedDates.length === 1) calPicker.clear();
        return;
      }
      const from = new Date(calPicker.selectedDates[0]).setHours(0, 0, 0, 0);
      const end = new Date(calPicker.selectedDates[1]).setHours(0, 0, 0, 0);
      // 结束边界取结束日当天最后一刻(end + DAY - 1ms),而非次日 0 点:
      // 报表的日键过滤(day > toKey 排除 to 之后)依赖 to 的日键 = 结束日。
      // 若用 end + DAY(次日 0 点),toKey = 次日,应用排行/电池健康会把结束日之后
      // 一天也纳入统计。预设范围 to = Date.now()(日键 = 今天,包含今天)不受影响。
      custom = [from, end + DAY - 1];
      currentRange = null;
      applyRange();
    },
  });

  function pickSource(from, to) {
    const span = to - from;
    if (span <= 2 * DAY && DATA.minutes.length && from >= timeOf(DATA.minutes[0]) - DAY) return "minutes";
    if (span <= 60 * DAY && DATA.hours.length && from >= timeOf(DATA.hours[0]) - DAY) return "hours";
    if (span <= 60 * DAY) return DATA.hours.length ? "hours" : "days";
    return "days";
  }

  // ── ECharts 公共样式 ─────────────────────────────────────────
  function liveTooltip() {
    // 颜色随主题变化,每次构造 option 时取实时值
    return {
      trigger: "axis",
      backgroundColor: C.tooltipBg,
      borderColor: C.tooltipBorder,
      borderWidth: 1,
      padding: [8, 12],
      textStyle: { color: C.tooltipText, fontSize: 12, fontFamily: FONT },
      axisPointer: { lineStyle: { color: "rgba(128,140,170,0.4)" } },
    };
  }
  function baseAxis(extra) {
    return Object.assign({
      axisLine: { lineStyle: { color: C.axis } },
      axisLabel: { color: C.label, fontSize: 11, hideOverlap: true },
      splitLine: { lineStyle: { color: C.grid } },
      axisTick: { show: false },
    }, extra || {});
  }
  function timeGrid() {
    return { left: 10, right: 18, top: 38, bottom: 6, containLabel: true };
  }
  const charts = {};
  function chart(id) {
    if (!charts[id]) charts[id] = echarts.init($(id), null, { renderer: "canvas" });
    return charts[id];
  }
  // 统一写图入口:打印重绘时关动画,保证 setOption 后能同步刷新到终态画布。
  function paintChart(id, option) {
    option.animation = !PRINTING;
    chart(id).setOption(option, { notMerge: true });
  }
  function setChart(id, option, rows, col) {
    const empty = $(id.replace("ch-", "e-"));
    const hasData = !col || hasAny(rows, col);
    if (!hasData) {
      chart(id).clear();
      $(id).hidden = true;
      if (empty) empty.style.display = "block";
      return;
    }
    $(id).hidden = false;
    if (empty) empty.style.display = "none";
    paintChart(id, option);
  }
  window.addEventListener("resize", () => {
    Object.values(charts).forEach((c) => c.resize());
  });

  function lineSeries(name, data, color, opts) {
    return Object.assign({
      name, type: "line", smooth: 0.25, symbol: "none",
      data, lineStyle: { width: 2, color },
      itemStyle: { color },
    }, opts || {});
  }
  function seriesData(rows, col, transform) {
    const out = [];
    rows.forEach((r) => {
      let x = v(r, col);
      if (x == null) { out.push([timeOf(r), null]); return; }
      if (transform) x = transform(x, r);
      out.push([timeOf(r), x]);
    });
    return out;
  }

  // 面积图垂直渐变:顶部近色、底部消隐,比平涂透明度更现代
  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  function areaGrad(color, topAlpha) {
    return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
      { offset: 0, color: rgba(color, topAlpha == null ? 0.34 : topAlpha) },
      { offset: 1, color: rgba(color, 0.02) },
    ]);
  }

  // ── 各区块渲染 ───────────────────────────────────────────────
  // KPI 迷你趋势图:降采样至 24 点,归一化画进 100×30 视口;样本不足两点时返回空串
  function sparkSVG(values) {
    const pts = values.filter((x) => x != null && isFinite(x));
    if (pts.length < 2) return "";
    const n = Math.min(pts.length, 24);
    const step = (pts.length - 1) / (n - 1);
    const sampled = [];
    for (let i = 0; i < n; i++) sampled.push(pts[Math.round(i * step)]);
    const min = Math.min.apply(null, sampled);
    const max = Math.max.apply(null, sampled);
    const span = max - min || 1;
    const H = 30;
    const xy = sampled.map((val, i) => {
      const x = (i / (n - 1)) * 100;
      const y = H - 3 - ((val - min) / span) * (H - 6);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    const line = xy.join(" ");
    return '<svg class="spark" viewBox="0 0 100 ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<polygon class="spark-area" points="0,' + H + " " + line + " 100," + H + '"></polygon>' +

  function renderHeatmap(from, to) {
    // 活动节律热力图:用小时层数据,按星期×时段聚合平均忙碌度。
    const rows = rowsBetween(DATA.hours, from, to);
    const cell = {};
    let maxCell = 0;
    rows.forEach((r) => {
      const cpu = v(r, "cpu_avg"), gpu = v(r, "gpu_avg"), mem = v(r, "mem_pressure_avg");
      if (cpu == null && gpu == null && mem == null) return;
      const busy = Math.max(cpu || 0, gpu || 0, mem || 0);
      const d = new Date(timeOf(r));
      const key = d.getDay() + "-" + d.getHours();
      if (!cell[key]) cell[key] = { sum: 0, n: 0 };
      cell[key].sum += busy * frames(r);
      cell[key].n += frames(r);
    });
    const data = [];
    const order = [1, 2, 3, 4, 5, 6, 0]; // 周一→周日
    order.forEach((weekday, yi) => {
      for (let h = 0; h < 24; h++) {
        const c = cell[weekday + "-" + h];
        if (!c || c.n === 0) return;
        const val = c.sum / c.n;
        maxCell = Math.max(maxCell, val);
        data.push([h, yi, val]);
      }
    });
    const weekdays = [I.wd1, I.wd2, I.wd3, I.wd4, I.wd5, I.wd6, I.wd0];
    const option = {
      backgroundColor: "transparent",
      textStyle: { fontFamily: FONT },
      tooltip: Object.assign({}, liveTooltip(), {
        trigger: "item",
        formatter: (p) => weekdays[p.value[1]] + " " + p.value[0] + ":00 – " + p.value[2].toFixed(1) + "%",
      }),
      grid: { left: 8, right: 14, top: 10, bottom: 26, containLabel: true },
      xAxis: baseAxis({
        type: "category",
        data: Array.from({ length: 24 }, (_, h) => h),
        splitLine: { show: false },
        axisLabel: { formatter: (h) => (h % 3 === 0 ? h : ""), color: C.label, fontSize: 11 },
        name: I.hourOfDay, nameLocation: "end", nameTextStyle: { color: C.label, fontSize: 10.5 },
      }),
      yAxis: baseAxis({ type: "category", data: weekdays, splitLine: { show: false } }),
      visualMap: {
        show: false, min: 0, max: Math.max(20, maxCell),
        inRange: { color: C.heat },
      },
      series: [{
        type: "heatmap",
        data,
        progressive: 0,
        itemStyle: { borderColor: C.heatBorder, borderWidth: 2, borderRadius: 3 },
        emphasis: { itemStyle: { shadowBlur: 6, shadowColor: "rgba(128,140,170,0.35)" } },
      }],
    };
    $("ch-heatmap").hidden = false;
    paintChart("ch-heatmap", option);
  }

  function distribution(rows, col) {
    const buckets = [0, 0, 0, 0, 0];
    rows.forEach((r) => {
      const x = v(r, col);
      if (x == null) return;
      const b = x < 10 ? 0 : x < 30 ? 1 : x < 60 ? 2 : x < 90 ? 3 : 4;
      // 用真实墙钟覆盖秒(cover_s)而非采样帧数:采样推迟/失败时帧数偏离真实时间。
      buckets[b] += coverSeconds(r);
    });
    const total = buckets.reduce((a, b) => a + b, 0);
    return total > 0 ? buckets : null;
  }
  function distOption(buckets, colors) {
    const total = buckets.reduce((a, b) => a + b, 0);
    return {
      backgroundColor: "transparent",
      textStyle: { fontFamily: FONT },
      color: colors,
      tooltip: Object.assign({}, liveTooltip(), {
        trigger: "item",
        // ECharts 饼图 trigger:item: p.value 是累计覆盖秒(cover_s,真实墙钟)。

        formatter: (p) => p.name + ": " + p.percent.toFixed(1) + "% (" + fmtHours(p.value) + ")",
      }),
      legend: { bottom: 0, left: "center", icon: "circle", itemWidth: 8, itemHeight: 8,
        textStyle: { color: C.label, fontSize: 11 } },

        label: { show: false },

        data: buckets.map((n, i) => ({ name: I["dist" + i], value: n })),
      }],
    };
  }
