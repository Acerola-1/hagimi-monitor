<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hagimi Monitor — 使用数据</title>
<meta name="description" content="Hagimi Monitor 的匿名使用数据统计。">
<link rel="icon" type="image/png" href="../images/icon-128.png" sizes="128x128">
<style>
:root{
  --bg:#f5f5f7;
  --ink:#1d1d1f;
  --accent:#0071e3;
  --muted:#6e6e73;
  --border:#d2d2d7;
  --green:#20c997;
  --display:"SF Pro Display",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --body:"SF Pro Text",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  font-family:var(--body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}

/* Nav */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:14px 0;
  background:rgba(245,245,247,.72);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 12px rgba(0,0,0,.06);
}
.nav-inner{
  max-width:1080px;margin:0 auto;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);}
.nav-brand .ring{width:30px;height:30px;}
.nav-brand .name{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;}

/* Hero */
.stats-hero{
  padding:120px 0 48px;
  text-align:center;
}
.stats-hero .kicker{font-size:15px;font-weight:500;color:var(--accent);letter-spacing:.02em;margin-bottom:8px;}
.stats-hero h1{font-family:var(--display);font-weight:600;font-size:clamp(32px,5vw,48px);letter-spacing:-.02em;}
.stats-hero .desc{font-size:16px;color:var(--muted);margin-top:12px;max-width:520px;margin-left:auto;margin-right:auto;}
.stats-back{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:20px;font-size:13px;color:var(--muted);
  text-decoration:none;border:1px solid var(--border);border-radius:6px;
  padding:6px 16px;transition:color .2s,border-color .2s;
}
.stats-back:hover{color:var(--ink);border-color:#999;}

/* Frame */
.stats-frame{
  max-width:1080px;margin:0 auto 80px;padding:0 32px;
}
.stats-frame-wrap{
  border:1px solid var(--border);border-radius:16px;
  overflow:hidden;background:#fff;
}
.stats-frame-wrap iframe{
  width:100%;height:min(80vh,1100px);min-height:640px;
  border:0;display:block;
}

/* Footer */
.footer{
  padding:40px 0;border-top:1px solid var(--border);
  font-size:13px;color:var(--muted);
}
.footer-inner{
  max-width:1080px;margin:0 auto;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.footer-brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;}
.footer-brand .ring{width:20px;height:20px;}
.footer-links{display:flex;gap:20px;list-style:none;}
.footer-links a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s;}
.footer-links a:hover{color:var(--ink);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="./" class="nav-brand">
      <svg class="ring" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="6.6" fill="none" stroke="#d2d2d7" stroke-width="1.35"/>
        <path d="M 9 2.4 A 6.6 6.6 0 1 1 3.3 12.3" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="9" cy="9" r="2.4" fill="#20c997"/>
      </svg>
      <span class="name">Hagimi Monitor</span>
    </a>
  </div>
</nav>

<section class="stats-hero">
  <div class="kicker">匿名统计</div>
  <h1>使用数据</h1>
  <p class="desc">所有指标均为匿名聚合统计，不包含任何可识别个人身份的信息。仅用于改善产品体验。</p>
  <a href="./" class="stats-back">&larr; 返回首页</a>
</section>

<div class="stats-frame">
  <div class="stats-frame-wrap">
    <iframe src="https://us.posthog.com/embedded/wYFGhALKsCXU9ST1kbW1Xv4XCS4hQw" loading="lazy" allowfullscreen></iframe>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <a href="./" class="footer-brand">
      <svg class="ring" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="6.6" fill="none" stroke="#d2d2d7" stroke-width="1.35"/>
        <path d="M 9 2.4 A 6.6 6.6 0 1 1 3.3 12.3" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="9" cy="9" r="2.4" fill="#20c997"/>
      </svg>
      <span>Hagimi Monitor</span>
    </a>
    <ul class="footer-links">
      <li><a href="./">首页</a></li>
      <li><a href="https://github.com/Acerola-1/hagimi-monitor" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://x.com/Acerola64175279" target="_blank" rel="noopener">X / Twitter</a></li>
    </ul>
    <span>© 2026 Hagimi Monitor. All rights reserved.</span>
  </div>
</footer>

</body>
</html>
